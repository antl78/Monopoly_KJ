<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Éditeur de plateau — Monopoly Custom</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0e0e10;
  --surface: #18181c;
  --surface2: #222228;
  --surface3: #2c2c34;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.13);
  --text: #f0f0f0;
  --text2: #9a9aaa;
  --text3: #5a5a6a;
  --accent: #e8d44d;
  --accent2: #c8b83d;
  --danger: #e85454;
  --success: #4eca8a;
  --r: 8px;
  --rl: 12px;
}

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* HEADER */
header {
  padding: 1rem 2rem;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--surface);
  position: sticky;
  top: 0;
  z-index: 100;
}
.logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px;
  letter-spacing: 0.12em;
  color: var(--accent);
}
.logo span { color: var(--text2); font-size: 14px; font-family: 'DM Sans', sans-serif; font-weight: 400; letter-spacing: 0; margin-left: 10px; }

.header-actions { display: flex; gap: 10px; align-items: center; }

/* BUTTONS */
.btn {
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 500;
  padding: 7px 16px;
  border-radius: var(--r);
  border: 1px solid var(--border2);
  background: var(--surface2);
  color: var(--text);
  cursor: pointer;
  transition: all 0.15s;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { background: var(--surface3); border-color: rgba(255,255,255,0.2); }
.btn.primary { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { background: var(--accent2); }
.btn.danger { background: transparent; color: var(--danger); border-color: rgba(232,84,84,0.3); }
.btn.danger:hover { background: rgba(232,84,84,0.1); }
.btn.sm { padding: 4px 10px; font-size: 12px; }
.btn.icon { padding: 6px 8px; }

/* LAYOUT */
.app { display: flex; flex: 1; align-items: flex-start; }

/* SIDEBAR */
.sidebar {
  width: 320px;
  min-width: 280px;
  border-right: 1px solid var(--border);
  background: var(--surface);
  display: flex;
  flex-direction: column;
  min-height: calc(100vh - 57px);
}
.sidebar-header {
  padding: 1rem 1.25rem;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.sidebar-title { font-size: 12px; font-weight: 500; color: var(--text2); letter-spacing: 0.08em; text-transform: uppercase; }
.case-counter { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--text3); }
.case-counter .filled { color: var(--accent); }

.cases-list {
  flex: 1;
  padding: 8px;
}


.case-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: var(--r);
  cursor: pointer;
  border: 1px solid transparent;
  transition: all 0.12s;
  margin-bottom: 2px;
  user-select: none;
}
.case-item:hover { background: var(--surface2); }
.case-item.active { background: var(--surface2); border-color: var(--border2); }
.case-item.active .case-pos { color: var(--accent); }

.case-pos {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--text3);
  min-width: 22px;
  text-align: right;
}
.case-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}
.case-name-list {
  font-size: 13px;
  color: var(--text);
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.case-type-badge {
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 99px;
  background: var(--surface3);
  color: var(--text3);
  flex-shrink: 0;
}

/* EDITOR PANEL */
.editor {
  flex: 1;
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 57px;
  height: calc(100vh - 57px);
  overflow: hidden;
}

.editor-top {
  padding: 1.25rem 2rem;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
}
.case-nav { display: flex; gap: 4px; }
.editor-content {
  flex: 1;
  overflow-y: auto;
  padding: 2rem;
}
.editor-content::-webkit-scrollbar { width: 4px; }
.editor-content::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

.editor-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
  max-width: 760px;
}
.field-full { grid-column: 1 / -1; }

.field { display: flex; flex-direction: column; gap: 6px; }
.field label {
  font-size: 11px;
  font-weight: 500;
  color: var(--text2);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.field input, .field select, .field textarea {
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: var(--r);
  color: var(--text);
  padding: 9px 12px;
  outline: none;
  transition: border-color 0.15s;
  width: 100%;
}
.field input:focus, .field select:focus, .field textarea:focus {
  border-color: var(--accent);
}
.field textarea { resize: vertical; min-height: 70px; }
.field select option { background: var(--surface2); }

.field input[type="number"] { font-family: 'DM Mono', monospace; }

/* COLOR PICKER */
.color-swatches {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.swatch {
  width: 28px; height: 28px;
  border-radius: 6px;
  cursor: pointer;
  border: 2px solid transparent;
  transition: transform 0.1s, border-color 0.1s;
  flex-shrink: 0;
}
.swatch:hover { transform: scale(1.1); }
.swatch.selected { border-color: white; transform: scale(1.15); }

/* RENTS */
.rents-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.rent-field { display: flex; flex-direction: column; gap: 4px; }
.rent-field label { font-size: 10px; color: var(--text3); letter-spacing: 0.04em; }
.rent-field input {
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 6px;
  color: var(--text);
  padding: 6px 8px;
  outline: none;
  width: 100%;
  transition: border-color 0.15s;
}
.rent-field input:focus { border-color: var(--accent); }

.section-sep {
  border: none;
  border-top: 1px solid var(--border);
  margin: 1.5rem 0;
}

/* PREVIEW PANEL */
.preview {
  width: 260px;
  min-width: 240px;
  border-left: 1px solid var(--border);
  background: var(--surface);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 57px;
  height: calc(100vh - 57px);
  overflow: hidden;
}
.preview-header {
  padding: 1rem 1.25rem;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  font-weight: 500;
  color: var(--text2);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.preview-content { padding: 1.25rem; flex: 1; overflow-y: auto; }

.card-preview {
  background: #fdf8ec;
  border-radius: 10px;
  overflow: hidden;
  color: #111;
  font-family: 'DM Sans', sans-serif;
  box-shadow: 0 4px 24px rgba(0,0,0,0.3);
  max-width: 180px;
  margin: 0 auto;
}
.card-color-band {
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 600;
  color: rgba(0,0,0,0.6);
  letter-spacing: 0.05em;
}
.card-body { padding: 10px 12px; }
.card-name { font-size: 13px; font-weight: 600; text-align: center; margin-bottom: 6px; line-height: 1.3; }
.card-price { text-align: center; font-size: 11px; color: #444; margin-bottom: 8px; }
.card-divider { border: none; border-top: 1px solid #ddd; margin: 6px 0; }
.card-rent-row { display: flex; justify-content: space-between; font-size: 10px; color: #333; padding: 1px 0; }
.card-rent-row.highlight { font-weight: 600; }
.card-mortgage { text-align: center; font-size: 10px; color: #888; margin-top: 8px; }

.preview-stats {
  margin-top: 1.5rem;
}
.stat-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--border); }
.stat-label { font-size: 12px; color: var(--text2); }
.stat-val { font-size: 12px; font-family: 'DM Mono', monospace; color: var(--text); }

/* EXPORT MODAL */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.75);
  display: none;
  align-items: center; justify-content: center;
  z-index: 200;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: var(--rl);
  width: 640px;
  max-width: 90vw;
  max-height: 80vh;
  display: flex; flex-direction: column;
  overflow: hidden;
}
.modal-header {
  padding: 1.25rem 1.5rem;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.modal-title { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 0.1em; color: var(--accent); }
.modal-body { padding: 1.25rem 1.5rem; overflow-y: auto; flex: 1; }
.json-out {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  background: var(--bg);
  border: 1px solid var(--border2);
  border-radius: var(--r);
  padding: 1rem;
  color: #8ddb8d;
  white-space: pre;
  overflow-x: auto;
  max-height: 50vh;
  overflow-y: auto;
}
.modal-footer {
  padding: 1rem 1.5rem;
  border-top: 1px solid var(--border);
  display: flex; gap: 8px; justify-content: flex-end;
}

/* IMPORT hidden */
#importInput { display: none; }

/* Toast */
.toast {
  position: fixed;
  bottom: 2rem; left: 50%; transform: translateX(-50%);
  background: var(--surface3);
  border: 1px solid var(--border2);
  border-radius: var(--r);
  padding: 10px 20px;
  font-size: 13px;
  color: var(--text);
  opacity: 0;
  transition: opacity 0.3s;
  z-index: 300;
  pointer-events: none;
}
.toast.show { opacity: 1; }
.toast.ok { border-color: rgba(78,202,138,0.4); color: var(--success); }

/* Chips for type */
.type-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.type-chip {
  font-size: 12px;
  padding: 5px 12px;
  border-radius: 99px;
  border: 1px solid var(--border2);
  background: var(--surface2);
  color: var(--text2);
  cursor: pointer;
  transition: all 0.12s;
}
.type-chip:hover { border-color: rgba(255,255,255,0.2); color: var(--text); }
.type-chip.active { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 600; }

.board-mini {
  margin-top: 1.5rem;
}

/* IMAGE FIELD */
.img-preview-wrap {
  display: flex; align-items: flex-start; gap: 10px; margin-top: 4px;
}
.img-preview-box {
  width: 56px; height: 56px; border-radius: var(--r);
  border: 1px solid var(--border2); background: var(--surface3);
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; overflow: hidden; flex-shrink: 0;
}
.img-preview-box img { width: 100%; height: 100%; object-fit: cover; }
.img-source-tabs { display: flex; gap: 4px; margin-bottom: 6px; }
.img-source-tab {
  font-size: 11px; padding: 3px 10px; border-radius: 99px;
  border: 1px solid var(--border2); background: var(--surface2);
  color: var(--text2); cursor: pointer; transition: all .12s;
}
.img-source-tab.active {
  background: var(--accent); color: #111; border-color: var(--accent); font-weight: 600;
}
.img-drop-zone {
  border: 1px dashed var(--border2); border-radius: var(--r);
  padding: 12px; text-align: center; font-size: 12px; color: var(--text3);
  cursor: pointer; transition: all .15s; background: var(--surface2);
}
.img-drop-zone:hover, .img-drop-zone.drag-over {
  border-color: var(--accent); color: var(--accent); background: rgba(232,212,77,.05);
}
.img-clear-btn {
  font-size: 11px; padding: 3px 8px; background: transparent;
  border: 1px solid rgba(232,84,84,.3); border-radius: 99px;
  color: #e85454; cursor: pointer;
}
.img-clear-btn:hover { background: rgba(232,84,84,.1); }
.board-mini-title { font-size: 10px; color: var(--text3); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px; }
.board-strip {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
}
.board-dot {
  width: 12px; height: 12px;
  border-radius: 2px;
  background: var(--surface3);
  cursor: pointer;
  transition: transform 0.1s;
  position: relative;
}
.board-dot:hover { transform: scale(1.3); }
.board-dot.current { outline: 2px solid white; outline-offset: 1px; }

/* RESPONSIVE tweaks */
.empty-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 100%;
  color: var(--text3);
  gap: 8px;
  font-size: 14px;
}
.empty-ico { font-size: 32px; }
</style>
</head>
<body>

<header>
  <div>
    <span class="logo">MONOPOLY<span>Éditeur de plateau</span></span>
  </div>
  <div class="header-actions">
    <input type="file" id="importInput" accept=".json">
    <button class="btn" onclick="document.getElementById('importInput').click()">⬆ Importer JSON</button>
    <button class="btn" onclick="resetBoard()">↺ Réinitialiser</button>
    <button class="btn primary" onclick="openExport()">⬇ Exporter JSON</button>
  </div>
</header>

<div class="app">
  <!-- SIDEBAR: liste des cases -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">Cases du plateau</span>
      <span class="case-counter"><span class="filled" id="filledCount">0</span>/40</span>
    </div>
    <div class="cases-list" id="casesList"></div>
  </aside>

  <!-- EDITOR central -->
  <main class="editor">
    <div class="editor-top">
      <div class="case-nav">
        <button class="btn icon" onclick="navCase(-1)" title="Précédent">◀</button>
        <button class="btn icon" onclick="navCase(1)" title="Suivant">▶</button>
      </div>
      <span id="editorTitle" style="font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:0.1em;color:var(--text2);">Sélectionne une case</span>
    </div>
    <div class="editor-content" id="editorContent">
      <div class="empty-state">
        <div class="empty-ico">🎲</div>
        <div>Clique sur une case dans la liste pour l'éditer</div>
      </div>
    </div>
  </main>

  <!-- PREVIEW -->
  <aside class="preview">
    <div class="preview-header">Aperçu</div>
    <div class="preview-content" id="previewContent">
      <div style="color:var(--text3);font-size:12px;text-align:center;margin-top:2rem;">Sélectionne une case pour voir l'aperçu</div>
    </div>
  </aside>
</div>

<!-- EXPORT MODAL -->
<div class="modal-overlay" id="exportModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Export JSON</span>
      <button class="btn sm" onclick="closeExport()">✕ Fermer</button>
    </div>
    <div class="modal-body">
      <pre class="json-out" id="jsonOut"></pre>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="copyJson()">📋 Copier</button>
      <button class="btn primary" onclick="downloadJson()">⬇ Télécharger plateau.json</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

}

let board = makeDefault();
let currentIdx = 0;

// ─── RENDER LIST ─────────────────────────────────────────────────────────────

function renderList() {
  const list = document.getElementById('casesList');
  list.innerHTML = '';
  let filled = 0;
  board.forEach((c, i) => {
    if(c.name && c.name.trim()) filled++;
    const grp = GROUPS.find(g => g.id === c.group) || GROUPS[8];
    const tp = TYPES.find(t => t.id === c.type) || TYPES[0];
    const div = document.createElement('div');
    div.className = 'case-item' + (i === currentIdx ? ' active' : '');
    div.innerHTML = `
      <span class="case-pos">${i}</span>
      <span class="case-dot" style="background:${c.group==='none'?'var(--surface3)':grp.color}"></span>
      <span class="case-name-list">${c.name || '<span style="color:var(--text3)">Sans nom</span>'}</span>
      <span class="case-type-badge">${tp.label}</span>
    `;
    div.onclick = () => { currentIdx = i; render(); };
    list.appendChild(div);
  });
  document.getElementById('filledCount').textContent = filled;
}

// ─── RENDER EDITOR ───────────────────────────────────────────────────────────

function render() {
  renderList();
  renderEditor();
  renderPreview();
  document.getElementById('editorTitle').textContent = `Case ${currentIdx} — ${board[currentIdx].name || 'Sans nom'}`;
}

function renderEditor() {
  const c = board[currentIdx];
  const isProperty = c.type === 'property';
  const isStation = c.type === 'station';
  const hasBuild = isProperty;
  const hasPrice = ['property','station','utility'].includes(c.type);

  document.getElementById('editorContent').innerHTML = `
    <div class="editor-grid">
      <div class="field field-full">

      <div class="field field-full">
        <label>Type de case</label>
        <div class="type-chips">

      </div>` : ''}

      ${hasTax ? `
      <div class="field">
        <label>Montant de la taxe (M$)</label>

      ${hasBuild ? `

          <input type="text" placeholder="Ex: 🏔️ ou laisser vide" value="${esc(c.icon && c.icon.length <= 4 ? c.icon : '')}" oninput="upd('icon',this.value)" style="max-width:140px">
          <span style="font-size:11px;color:var(--text3)">1 à 2 caractères</span>
        </div>
        <div id="imgTabUrl" style="display:${c.icon && c.icon.startsWith('http') ? 'block' : 'none'}">
          <input type="text" placeholder="https://i.imgur.com/..." value="${esc(c.icon && c.icon.startsWith('http') ? c.icon : '')}" oninput="upd('icon',this.value)" style="width:100%">
        </div>
        <div id="imgTabUpload" style="display:${c.icon && c.icon.startsWith('data:') ? 'block' : 'none'}">

            📁 Cliquer pour choisir une image (PNG, JPG, GIF…)

        </div>
        <div class="img-preview-wrap" style="margin-top:8px">
          <div class="img-preview-box" id="iconPreviewBox">${renderIconPreviewHTML(c.icon)}</div>

            <div style="font-size:11px;color:var(--text3);margin-bottom:6px">Aperçu sur la case</div>
            ${c.icon ? '<button class="img-clear-btn" onclick="clearIcon()">✕ Supprimer</button>' : '<span style="font-size:11px;color:var(--text3)">Aucune icône</span>'}
          </div>
        </div>
      </div>

      <div class="field field-full">
        <label>Description / Note (facultatif)</label>
        <textarea placeholder="Ex: La case la plus chère du plateau..." oninput="upd('desc',this.value)">${esc(c.desc||'')}</textarea>
      </div>
    </div>
  `;
}

// ─── RENDER PREVIEW ──────────────────────────────────────────────────────────

function renderPreview() {
  const c = board[currentIdx];
  const grp = GROUPS.find(g => g.id === c.group) || GROUPS[8];
  const isProperty = c.type === 'property';
  const isStation = c.type === 'station';

  let cardHtml = '';
  const iconHtmlPreview = c.icon ? renderIconPreviewHTML(c.icon) : '';
  if(isProperty) {
    cardHtml = `
      <div class="card-preview">
        <div class="card-color-band" style="background:${grp.color};color:${textOnBg(grp.color)}">${grp.label.toUpperCase()}</div>
        <div class="card-body">
          <div class="card-name">${iconHtmlPreview ? '<span style="vertical-align:middle;margin-right:3px">' + iconHtmlPreview + '</span>' : ''}${c.name||'Sans nom'}</div>
          <div class="card-price">Prix: M$${c.price}</div>
          <hr class="card-divider">
          <div class="card-rent-row"><span>Loyer nu</span><span>M$${c.rents[0]}</span></div>
          <div class="card-rent-row"><span>Monopole</span><span>M$${c.rents[1]}</span></div>
          <div class="card-rent-row"><span>1 maison</span><span>M$${c.rents[2]}</span></div>
          <div class="card-rent-row"><span>2 maisons</span><span>M$${c.rents[3]}</span></div>
          <div class="card-rent-row"><span>3 maisons</span><span>M$${c.rents[4]}</span></div>
          <div class="card-rent-row highlight"><span>Hôtel</span><span>M$${c.rents[5]}</span></div>
          <hr class="card-divider">
          <div class="card-rent-row"><span>Maison/Hôtel</span><span>M$${c.buildCost}</span></div>
          <div class="card-mortgage">Hypothèque: M$${c.mortgage}</div>
        </div>
      </div>`;
  } else if(isStation) {
    cardHtml = `
      <div class="card-preview">
        <div class="card-color-band" style="background:#333;color:#eee">GARE</div>
        <div class="card-body">
          <div class="card-name">${c.name||'Gare'}</div>
          <div class="card-price">Prix: M$${c.price}</div>
          <hr class="card-divider">
          <div class="card-rent-row"><span>1 gare</span><span>M$${c.rents[0]}</span></div>
          <div class="card-rent-row"><span>2 gares</span><span>M$${c.rents[1]}</span></div>
          <div class="card-rent-row"><span>3 gares</span><span>M$${c.rents[2]}</span></div>
          <div class="card-rent-row highlight"><span>4 gares</span><span>M$${c.rents[3]}</span></div>
          <div class="card-mortgage">Hypothèque: M$${c.mortgage}</div>
        </div>
      </div>`;
  } else {
    const tp = TYPES.find(t => t.id === c.type);
    cardHtml = `
      <div class="card-preview">
        <div class="card-color-band" style="background:#2a2a35;color:#aaa">${tp?tp.label.toUpperCase():'CASE'}</div>
        <div class="card-body">
          <div class="card-name">${c.name||'Sans nom'}</div>
          ${c.desc?`<p style="font-size:11px;color:#555;text-align:center;margin-top:6px;">${c.desc}</p>`:''}
        </div>
      </div>`;
  }

  // Stats
  const totalCases = board.filter(cc => cc.type==='property').length;
  const totalVal = board.filter(cc=>cc.price>0).reduce((s,cc)=>s+cc.price,0);

  const miniDots = board.map((cc,i) => {
    const g = GROUPS.find(gg=>gg.id===cc.group)||GROUPS[8];
    const col = cc.group!=='none' ? g.color : 'var(--surface3)';
    return `<div class="board-dot${i===currentIdx?' current':''}" style="background:${col}" title="${i}: ${cc.name}" onclick="currentIdx=${i};render()"></div>`;
  }).join('');

  document.getElementById('previewContent').innerHTML = `
    ${cardHtml}
    <div class="preview-stats">
      <div class="stat-row"><span class="stat-label">Position</span><span class="stat-val">${currentIdx}/39</span></div>
      <div class="stat-row"><span class="stat-label">Type</span><span class="stat-val">${TYPES.find(t=>t.id===c.type)?.label||'?'}</span></div>
      ${c.price>0?`<div class="stat-row"><span class="stat-label">Prix</span><span class="stat-val">M$${c.price}</span></div>`:''}
    </div>
    <div class="board-mini">
      <div class="board-mini-title">Mini-plateau (40 cases)</div>
      <div class="board-strip">${miniDots}</div>
    </div>
  `;
}

// ─── MUTATIONS ───────────────────────────────────────────────────────────────

function upd(key, val) {
  board[currentIdx][key] = val;
  renderList();
  renderPreview();
  document.getElementById('editorTitle').textContent = `Case ${currentIdx} — ${board[currentIdx].name || 'Sans nom'}`;
  if(key === 'icon') updateIconPreview(val);
}

function clearIcon() {
  upd('icon', '');
  renderEditor();
  renderPreview();
}

function updN(key, val) {
  board[currentIdx][key] = parseInt(val)||0;
  renderPreview();
}

function updRent(idx, val) {
  board[currentIdx].rents[idx] = parseInt(val)||0;
  renderPreview();
}

function updType(type) {
  board[currentIdx].type = type;
  if(type!=='property') board[currentIdx].group = 'none';
  renderEditor();
  renderPreview();
  renderList();
}

function navCase(dir) {
  currentIdx = (currentIdx + dir + 40) % 40;
  render();
}

// ─── EXPORT / IMPORT ─────────────────────────────────────────────────────────

function openExport() {
  document.getElementById('jsonOut').textContent = JSON.stringify({ version:'1.0', name:'Mon Monopoly', board }, null, 2);
  document.getElementById('exportModal').classList.add('open');
}
function closeExport() { document.getElementById('exportModal').classList.remove('open'); }

function copyJson() {
  navigator.clipboard.writeText(document.getElementById('jsonOut').textContent);
  toast('JSON copié dans le presse-papiers !', 'ok');
}

function downloadJson() {
  const blob = new Blob([document.getElementById('jsonOut').textContent], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'plateau.json';
  a.click();
  toast('Fichier téléchargé !', 'ok');
}

document.getElementById('importInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const data = JSON.parse(ev.target.result);
      if(data.board && Array.isArray(data.board) && data.board.length===40) {
        board = data.board;
        currentIdx = 0;
        render();
        toast('Plateau importé avec succès !', 'ok');
      } else { toast('JSON invalide : le tableau board doit contenir 40 cases.'); }
    } catch(err) { toast('Erreur de lecture du fichier JSON.'); }
  };
  reader.readAsText(file);
  this.value = '';
});

function resetBoard() {
  if(confirm('Réinitialiser le plateau aux valeurs par défaut ?')) {
    board = makeDefault();
    currentIdx = 0;
    render();
    toast('Plateau réinitialisé.', 'ok');
  }
}

// ─── HELPERS ─────────────────────────────────────────────────────────────────

function esc(s) { return (s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function textOnBg(hex) {
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return (r*299+g*587+b*114)/1000 > 128 ? '#111' : '#eee';
}

function toast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type?' '+type:'');
  setTimeout(()=>t.className='toast',2500);
}

// ─── IMAGE HELPERS ───────────────────────────────────────────────────────────

function renderIconPreviewHTML(src) {
  if(!src) return "<span style='color:var(--text3);font-size:11px'>—</span>";
  if(src.startsWith('http') || src.startsWith('data:')) {
    const img = document.createElement('img');
    img.src = src;
    img.style.cssText = 'width:100%;height:100%;object-fit:cover';
    img.onerror = function(){ this.style.display='none'; };
    return img.outerHTML;
  }
  return "<span>" + src + "</span>";
}

let currentImgTab = 'emoji';

function switchImgTab(tab) {
  currentImgTab = tab;
  ['emoji','url','upload'].forEach(t => {
    const el = document.getElementById('imgTab' + t.charAt(0).toUpperCase() + t.slice(1));
    const tabEl = document.querySelector('.img-source-tab[onclick*="' + t + '"]');
    if(el) el.style.display = t === tab ? (t === 'emoji' ? 'flex' : 'block') : 'none';
    if(tabEl) tabEl.classList.toggle('active', t === tab);
  });
  // Clear icon when switching tabs
  if(tab !== currentImgTab) {
    upd('icon', '');
    updateIconPreview('');
  }
}

function updateIconPreview(src) {
  const box = document.getElementById('iconPreviewBox');
  if(box) box.innerHTML = renderIconPreviewHTML(src);
}

function loadIconFile(input) {
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const b64 = e.target.result;
    upd('icon', b64);
    updateIconPreview(b64);
    const zone = document.getElementById('imgDropZone');
    if(zone) zone.innerHTML = '✓ ' + file.name;
    renderPreview();
  };
  reader.readAsDataURL(file);
}

// Drag & drop support
document.addEventListener('dragover', function(e) {
  const zone = document.getElementById('imgDropZone');
  if(zone && e.target.closest('#imgDropZone')) {
    e.preventDefault();
    zone.classList.add('drag-over');
  }
});
document.addEventListener('dragleave', function(e) {
  const zone = document.getElementById('imgDropZone');
  if(zone) zone.classList.remove('drag-over');
});
document.addEventListener('drop', function(e) {
  const zone = document.getElementById('imgDropZone');
  if(zone && e.target.closest('#imgDropZone')) {
    e.preventDefault();
    zone.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if(file && file.type.startsWith('image/')) {
      const fakeInput = { files: [file] };
      loadIconFile(fakeInput);
    }
  }
});

// ─── INIT ────────────────────────────────────────────────────────────────────
render();
</script>
