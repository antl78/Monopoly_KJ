<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monopoly Custom — Moteur de jeu</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#eef4ef;--surface:#ffffff;--surface2:#f2f8f3;
  --border:#dde8de;--border2:#c6d9c9;
  --text:#16241f;--text2:#5c7268;--text3:#93a89c;
  --accent:#0f6e63;--accent2:#0b564d;
  --money:#188a4c;--danger:#c23b3b;
  --board-fill:#d3ead5;
  --r:10px;--rl:16px;
  --shadow:0 1px 3px rgba(15,60,50,.08), 0 6px 16px rgba(15,60,50,.06);
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow:hidden}

/* ── SCREENS ─────────────────────────────────── */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10}
.screen.hidden{display:none}

/* SETUP SCREEN */
#setupScreen{background:radial-gradient(ellipse at 50% 0%, #dcece0 0%, var(--bg) 70%)}
.setup-card{background:var(--surface);border:1px solid var(--border2);border-radius:20px;box-shadow:var(--shadow);padding:2.5rem 3rem;width:520px;max-width:94vw}
.setup-title{font-family:'Bebas Neue',sans-serif;font-size:48px;letter-spacing:.1em;color:var(--accent);text-align:center;margin-bottom:4px}
.setup-sub{text-align:center;color:var(--text2);font-size:14px;margin-bottom:2rem}
.setup-section{margin-bottom:1.5rem}
.setup-label{font-size:11px;font-weight:500;color:var(--text2);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
.player-rows{display:flex;flex-direction:column;gap:8px}
.player-row{display:flex;align-items:center;gap:8px}
.player-row input{flex:1;font-family:'DM Sans',sans-serif;font-size:14px;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--r);color:var(--text);padding:8px 12px;outline:none}
.player-row input:focus{border-color:var(--accent)}
.pawn-pick{display:flex;gap:4px;flex-wrap:wrap}
.pawn-btn{width:32px;height:32px;border-radius:6px;border:1px solid var(--border2);background:var(--surface2);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .12s;flex-shrink:0}
.pawn-btn:hover,.pawn-btn.sel{border-color:var(--accent);background:rgba(15,110,99,.1)}
/* Upload-your-own-image pawn control: deliberately NOT a plain 32×32 square
   like the emoji choices, so it doesn't read as "just another pawn" — it's
   wider, has a dashed border, and always carries an explicit text label.
   Shows a small camera glyph + label, or a thumbnail + "Modifier" once an
   image has been chosen (see handlePawnFile()). */
.pawn-btn-upload{width:auto;height:32px;padding:0 10px 0 7px;gap:6px;font-size:12px;font-weight:600;font-family:'DM Sans',sans-serif;white-space:nowrap;border-style:dashed;color:var(--text2,inherit)}
.pawn-btn-upload.sel{border-style:solid}
.pawn-btn-thumb{width:20px;height:20px;object-fit:cover;border-radius:4px;flex-shrink:0}
/* An uploaded pawn image, wherever a pawn is shown (sidebar avatar, board
   token, victory screen...) — see pawnIconHtml(). Sized in `em` so it
   always matches the font-size of whatever pawn slot it's dropped into,
   circular-cropped with a light ring so it reads as a token on any board
   color. */
.pawn-img-icon{width:1em;height:1em;object-fit:cover;border-radius:50%;vertical-align:-0.15em;box-shadow:0 0 0 2px rgba(255,255,255,.85)}
.add-player-btn{font-size:13px;color:var(--text2);background:transparent;border:1px dashed var(--border2);border-radius:var(--r);padding:7px;cursor:pointer;transition:all .12s;width:100%}
.add-player-btn:hover{color:var(--text);border-color:var(--accent)}
.import-row{display:flex;gap:8px}
.import-box{flex:1;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--r);padding:8px 12px;display:flex;align-items:center;justify-content:space-between;font-size:13px;cursor:pointer;transition:all .12s}
.import-box:hover{border-color:var(--accent)}
.import-box.loaded{border-color:rgba(24,138,76,.5);color:var(--money)}
.import-box span{color:var(--text3);font-size:11px}
.btn-start{width:100%;padding:14px;background:var(--accent);color:#fff;font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.15em;border:none;border-radius:var(--r);cursor:pointer;margin-top:1rem;transition:all .15s}
.btn-start:hover{background:var(--accent2);transform:translateY(-1px)}
.btn-start:disabled{opacity:.4;cursor:not-allowed;transform:none}
.money-input{font-family:'DM Mono',monospace;width:110px;font-size:14px;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--r);color:var(--accent);padding:8px 12px;outline:none}
.money-input:focus{border-color:var(--accent)}
input[type=file]{display:none}

/* ── GAME SCREEN ─────────────────────────────── */
#gameScreen{background:var(--bg);flex-direction:column;align-items:stretch;justify-content:flex-start;overflow:hidden}
#gameScreen.hidden{display:none}
.game-main{flex:1;display:flex;flex-direction:row;min-height:0;overflow:hidden}

/* BOARD */
.board-wrap{flex:1;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;padding:1rem;position:relative}
/* Track sizing mimics a real Monopoly board: the 4 corner/depth tracks are
   wider (1.8fr) than the 9 along-edge tracks (1fr each). That shrinks the
   blank center (it spans the same 9 along-edge tracks on both axes) and
   grows every playable cell at the same time — corners because their own
   track got wider, and top/bottom/left/right cells because their "depth"
   dimension (the row for top/bottom, the column for left/right) now uses
   the wide 1.8fr track instead of an equal 1fr one. */
.board{container-type:inline-size;container-name:board;display:grid;grid-template-columns:1.8fr repeat(9,1fr) 1.8fr;grid-template-rows:1.8fr repeat(9,1fr) 1.8fr;width:min(calc(100vh - 108px), calc(100vw - 400px));height:min(calc(100vh - 108px), calc(100vw - 400px));border:2px solid var(--accent2);border-radius:8px;overflow:hidden;background:var(--board-fill);position:relative;box-shadow:var(--shadow)}
.cell{background:var(--board-fill);border:1px solid rgba(15,60,50,.12);position:relative;cursor:default;overflow:hidden}
.cell:hover{border-color:var(--accent);z-index:2}
/* .cell-content is a layer separate from .cell so it can be resized/rotated
   independently of the actual grid box. Top/bottom cells are naturally
   PORTRAIT (narrow × tall) with this track sizing, so their content just
   needs a 180° flip for the top row (readable from "outside" the board).
   Left/right cells are naturally LANDSCAPE (wide × short) — their content
   is instead pre-sized to the swapped, portrait dimensions (55.56% × 180%,
   the exact inverse of the 1.8 corner/edge ratio) and rotated ±90°, so it
   ends up filling the landscape box exactly with no overflow or clipping. */
.cell-content{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:3px;gap:2px;font-size:clamp(9px,1.75cqw,19px)}
/* When a cell has a color band, split the box in two: the band glues to
   the pre-transform "top" (which every side rule below maps to the board's
   inner edge) and the name/price block glues to the pre-transform "bottom"
   (mapped to the board's outer edge) — see .cell-text below. Cells with no
   color band (chance, tax, community...) keep the default flex-end so their
   text still sits toward the outer edge. */
.cell-content:has(.cell-color){justify-content:space-between}
.cell-text{width:100%;display:flex;flex-direction:column;align-items:center;gap:2px}
/* Top row: no rotation and no reversal needed here — the default (untouched)
   flex-direction:column already reads right-side up, with .cell-color glued
   to the physical top of the box (the board's outer edge) and .cell-text
   glued to the physical bottom (the board's inner edge, toward the center).
   That's a deliberate exception to the "text sits on the outer edge" rule
   above: cramming the name/price against the board's outer border looked
   worse than having the color band frame that edge instead, so on this one
   side the roles are swapped — the color band plays the "outer edge" role
   and the text sits closer to the center. (A 180° rotation, which is how a
   real cardboard board prints its far edge so it reads right-side up for a
   player sitting across the table, isn't needed either: everyone here looks
   at the same screen from the same fixed angle.) */
.cell-side-left .cell-content,.cell-side-right .cell-content{top:50%;left:50%;width:55.56%;height:180%}
/* Left/right columns: pre-rotation "top" (the color band) must land on the
   side facing the board's center (inner edge), not the screen edge. The
   left column's inner edge is to its right, so its content is rotated
   clockwise (+90deg); the right column's inner edge is to its left, so its
   content is rotated counter-clockwise (-90deg) — the reverse of what was
   here before, which pointed each side's content outward instead of inward. */
.cell-side-left .cell-content{transform:translate(-50%,-50%) rotate(90deg)}
.cell-side-right .cell-content{transform:translate(-50%,-50%) rotate(-90deg)}
.cell-color{width:100%;height:20%;border-radius:1px;flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:1px;overflow:hidden;transition:height .2s ease}
/* Alertes / alerteprison bought on a property show up inside its color band
   (see renderCellAlerts()); the band grows a little to make them readable. */
.cell-color.has-alerts{height:30%}
.cell-alert{height:100%;aspect-ratio:1;max-width:24%;min-width:0;object-fit:contain;flex-shrink:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.45))}
.cell-alert.prison{max-width:80%}
.cell-name{width:100%;font-size:.95em;font-weight:700;color:#000;text-align:center;line-height:1.15;padding:1px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;word-break:break-word}
.cell-price{width:100%;font-family:'DM Mono',monospace;font-size:.88em;font-weight:700;color:#000;text-align:center}
.cell-corner{width:100%;font-size:2.1em;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1px;color:var(--accent)}
.cell-corner .lbl{width:100%;font-size:.5em;font-weight:700;color:#000;text-transform:uppercase;letter-spacing:.02em;word-break:break-word;line-height:1.05}
.cell-icon-img{width:clamp(18px,3.6cqw,40px);height:clamp(18px,3.6cqw,40px);object-fit:cover;border-radius:2px;flex-shrink:0}
.cell-icon-emoji{font-size:clamp(12px,2.1cqw,23px);line-height:1;flex-shrink:0}
/* Currency icon (oufingouf.png), replaces the "M$" symbol everywhere. Sized
   in em units so it always tracks the font-size of whatever text/number it
   sits next to, wherever that text appears (cell price, badges, panels...). */
.currency-icon{height:1em;width:1em;object-fit:contain;vertical-align:-0.15em;margin:0 .12em;flex-shrink:0}
.cell-center{grid-column:2/11;grid-row:2/11;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;background:var(--board-fill)}
.center-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(16px,4.5cqw,34px);letter-spacing:.15em;color:var(--accent2);text-align:center}
.center-sub{font-size:clamp(9px,1.6cqw,13px);color:var(--text2);text-align:center}
/* Pawns live in one floating layer above the whole board rather than inside
   each cell: that's what lets a pawn glide/hop smoothly from cell to cell
   (see walkPawn()/positionAllPawnTokens() in JS) instead of jumping straight
   from its old square to its new one. Each token is positioned with
   transform:translate() to a pixel point read off the real DOM cell via
   getBoundingClientRect(), so it stays correct at any board size. */
#pawnLayer{position:absolute;inset:0;pointer-events:none;z-index:4}
.pawn-token{position:absolute;top:0;left:0;font-size:clamp(22px,4.4cqw,46px);line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45));transition:transform .32s ease;will-change:transform}

/* Fallback for browsers without container query units (cqw): approximate
   with viewport-width based clamps so old browsers still get scaling. */
@supports not (width: 1cqw) {
  .cell-content{font-size:clamp(7px,1.5vw,16px)}
  .cell-icon-img{width:clamp(14px,3.1vw,34px);height:clamp(14px,3.1vw,34px)}
  .cell-icon-emoji{font-size:clamp(10px,1.9vw,20px)}
  .center-title{font-size:clamp(14px,2.5vw,32px)}
  .center-sub{font-size:clamp(8px,1vw,12px)}
  .pawn-token{font-size:clamp(20px,3.8vw,40px)}
}

/* SIDEBAR */
.sidebar{width:360px;min-width:300px;display:flex;flex-direction:column;border-left:1px solid var(--border);background:var(--bg);overflow:hidden}
.sidebar-header{padding:.8rem 1rem;display:flex;align-items:center;justify-content:space-between}
.sidebar-title{font-family:'Bebas Neue',sans-serif;font-size:19px;letter-spacing:.1em;color:var(--accent)}
.turn-indicator{font-size:12px;color:var(--text2)}
.panels-scroll{padding:0 10px 4px;overflow-y:auto;flex:0 0 auto;max-height:48%}
.panels-scroll::-webkit-scrollbar{width:3px}
.panels-scroll::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* PANELS (Joueur / Adversaires / Banque) */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
.panel-active{padding:14px 16px}
.pa-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.pa-pawn{font-size:22px}
.pa-name{font-weight:600;font-size:14px;flex:1;color:var(--text)}
.pa-money{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.03em;color:var(--money)}
.grp-grid{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.grp-row{display:flex;gap:4px;flex-wrap:wrap}
.grp-pip{width:14px;height:14px;border-radius:3px;border:2px solid var(--pc);background:transparent;flex-shrink:0}
.grp-pip.filled{background:var(--pc)}
.quick-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}

.panel-header{padding:.8rem 1rem;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-size:13px;font-weight:600;color:var(--text2);letter-spacing:.02em;user-select:none}
.panel-header:hover{color:var(--text)}
.chevron{color:var(--text3);font-size:11px}
.panel-content{padding:0 1rem .9rem;display:flex;flex-direction:column;gap:6px}
.empty-note{font-size:12px;color:var(--text3);font-style:italic}

.opp-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--border);font-size:12.5px}
.opp-row:first-child{border-top:none}
.opp-row.bankrupt{opacity:.4}
.opp-pawn{font-size:16px}
.opp-name{flex:1;color:var(--text)}
.opp-props{color:var(--text3);font-size:11px}
.opp-money{font-family:'DM Mono',monospace;color:var(--money);font-weight:500}

/* HISTORY */
.history-panel{flex:1;display:flex;flex-direction:column;min-height:120px;border-top:1px solid var(--border);background:var(--surface)}
.history-header{padding:.7rem 1rem;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border)}
.history-timer{font-family:'DM Mono',monospace;color:var(--text3);font-weight:400;font-size:11px}
.log-area{flex:1;overflow-y:auto;padding:8px 10px;display:flex;flex-direction:column;gap:2px;background:var(--surface)}
.log-area::-webkit-scrollbar{width:3px}
.log-area::-webkit-scrollbar-thumb{background:var(--border2)}
.log-entry{font-size:11.5px;color:var(--text2);line-height:1.4;padding:3px 0;border-bottom:1px solid var(--border)}
.log-entry.important{color:var(--text);font-weight:600}
.log-entry.gain{color:var(--money)}
.log-entry.loss{color:var(--danger)}
.log-entry.move{color:#2f7ab8}
.log-entry.chance{color:#a9720b}
.log-entry.system{color:var(--text3);font-style:italic}

/* CONSOLE BAR */
.console-bar{display:flex;align-items:center;gap:10px;padding:10px 18px;background:var(--accent2);border-top:1px solid rgba(0,0,0,.15);flex-wrap:wrap}
.console-btn{font-family:'DM Sans',sans-serif;font-weight:600;font-size:12.5px;letter-spacing:.02em;color:#eafaf3;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:10px 16px;cursor:pointer;transition:all .12s;white-space:nowrap}
.console-btn:hover:not(:disabled){background:rgba(255,255,255,.16)}
.console-btn:disabled{opacity:.35;cursor:not-allowed}
.console-dice{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:6px 10px 6px 6px}
.console-dice .dice-total{color:#fff}
.console-dice .btn-roll{padding:9px 18px;font-size:15px}
.console-brand{margin-left:auto;font-family:'Bebas Neue',sans-serif;letter-spacing:.12em;color:rgba(255,255,255,.45);font-size:14px;white-space:nowrap}
.console-brand span{color:#eafaf3}

/* DICE (shared) */
.dice{width:40px;height:40px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:22px;transition:transform .15s;user-select:none;position:relative;overflow:hidden}
.dice.rolling{animation:diceRoll .6s ease forwards}
@keyframes diceRoll{
  0%  {transform:rotate(0deg) scale(1);filter:blur(0px)}
  15% {transform:rotate(-20deg) scale(1.25);filter:blur(1px)}
  30% {transform:rotate(15deg) scale(0.9);filter:blur(2px)}
  45% {transform:rotate(-10deg) scale(1.15);filter:blur(1px)}
  60% {transform:rotate(8deg) scale(0.95);filter:blur(1px)}
  75% {transform:rotate(-4deg) scale(1.05);filter:blur(0px)}
  100%{transform:rotate(0deg) scale(1);filter:blur(0px)}
}
.dice-total{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:.05em;min-width:28px}
.btn-roll{padding:11px 18px;background:var(--accent);color:#fff;font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:.1em;border:none;border-radius:var(--r);cursor:pointer;transition:all .15s}
.btn-roll:hover:not(:disabled){background:#0a4a42}
.btn-roll:disabled{opacity:.4;cursor:not-allowed}

/* Big centered dice, shown over the whole screen for the dramatic part of
   each roll (the small console dice next to "Lancer" keep showing the same
   result afterward as a persistent readout). Fixed + centered on the
   viewport rather than the board, so it reads as "the game rolling", not
   tied to board position. */
.dice-overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:120;pointer-events:none;opacity:0;transition:opacity .22s ease}
.dice-overlay.show{opacity:1}
.dice-overlay-panel{background:rgba(8,28,24,.85);border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:28px 36px;display:flex;align-items:center;gap:20px;box-shadow:0 16px 44px rgba(0,0,0,.4)}
.big-dice{width:min(84px,18vw);height:min(84px,18vw);background:#fff;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:min(60px,13vw);color:#0d3b32;box-shadow:0 6px 18px rgba(0,0,0,.35);line-height:1}
.big-dice.rolling{animation:bigDiceRoll .5s cubic-bezier(.34,1.4,.64,1) infinite}
@keyframes bigDiceRoll{
  0%  {transform:rotate(0deg) scale(1)}
  25% {transform:rotate(-24deg) scale(1.12)}
  50% {transform:rotate(18deg) scale(.9)}
  75% {transform:rotate(-10deg) scale(1.08)}
  100%{transform:rotate(0deg) scale(1)}
}
.big-dice-total{font-family:'Bebas Neue',sans-serif;font-size:min(40px,8vw);color:#fff;letter-spacing:.06em;min-width:52px;text-align:center}

.btn-sm{font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;padding:6px 12px;border-radius:var(--r);border:1px solid var(--border2);background:var(--surface2);color:var(--text);cursor:pointer;transition:all .12s}
.btn-sm:hover{background:#e6f1e8}
.btn-sm.green{border-color:rgba(24,138,76,.35);color:#157a3f;background:rgba(24,138,76,.06)}
.btn-sm.red{border-color:rgba(194,59,59,.35);color:#a83030;background:rgba(194,59,59,.06)}
.btn-sm.warn{border-color:rgba(184,134,11,.35);color:#8a6314;background:rgba(184,134,11,.06)}
.btn-sm:disabled{opacity:.3;cursor:not-allowed}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(10,25,20,.55);display:flex;align-items:center;justify-content:center;z-index:50}
.modal-overlay.hidden{display:none}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:var(--rl);box-shadow:var(--shadow);width:420px;max-width:92vw;max-height:85vh;display:flex;flex-direction:column;overflow:hidden}
.modal-header{padding:1.25rem 1.5rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.1em;color:var(--text)}
.modal-body{padding:1.25rem 1.5rem;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:10px}
.modal-footer{padding:1rem 1.5rem;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}

/* BUY MODAL / TITLE DEED */
.buy-price{font-family:'Bebas Neue',sans-serif;font-size:32px;color:var(--accent);text-align:center;letter-spacing:.05em}
.title-deed{border:1px solid var(--border2);border-radius:12px;overflow:hidden;background:#fff}
.td-band{height:10px}
.td-body{padding:14px 16px}
.td-kicker{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);text-align:center}

let boardData = defaultBoard();
let cardData = defaultCards();
let playerDefs = [];

const PAWNS_USED = new Set();

function addPlayerRow(name='', pawn='') {
  if(playerDefs.length >= 6) return;
  const idx = playerDefs.length;
  const defaultPawn = PAWN_EMOJIS.find(p=>!PAWNS_USED.has(p)) || PAWN_EMOJIS[idx%12];
  const def = {name: name||`Joueur ${idx+1}`, pawn: pawn||defaultPawn};
  PAWNS_USED.add(def.pawn);
  playerDefs.push(def);
  renderSetup();
}

function removePlayerRow(idx) {
  PAWNS_USED.delete(playerDefs[idx].pawn);
  playerDefs.splice(idx,1);
  renderSetup();
}

// `pawn` is either one of PAWN_EMOJIS or an uploaded image's data URL (see
// handlePawnFile) — selectPawn() itself doesn't need to tell them apart.
function selectPawn(playerIdx, pawn) {
  PAWNS_USED.delete(playerDefs[playerIdx].pawn);
  playerDefs[playerIdx].pawn = pawn;
  PAWNS_USED.add(pawn);
  renderSetup();
}

// Uploaded pawn images are normalized to this square size (px) — small
// enough to keep the resulting data URL light, big enough to still look
// sharp at the sizes a pawn is shown on-screen (see .pawn-img-icon, sized
// in em so the display size elsewhere is independent of this anyway).
const PAWN_IMG_SIZE = 96;

// Reads the chosen file, draws it center-cropped to a PAWN_IMG_SIZE square
// canvas (so every uploaded pawn ends up the same size regardless of the
// source photo's resolution or aspect ratio), and sets the result as this
// player's pawn.
function handlePawnFile(idx, inputEl){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){
    toast("Ce fichier n'est pas une image.");
    inputEl.value='';
    return;
  }
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = PAWN_IMG_SIZE;
      canvas.height = PAWN_IMG_SIZE;
      const ctx = canvas.getContext('2d');
      const side = Math.min(img.naturalWidth, img.naturalHeight);
      const sx = (img.naturalWidth-side)/2, sy = (img.naturalHeight-side)/2;
      ctx.drawImage(img, sx, sy, side, side, 0, 0, PAWN_IMG_SIZE, PAWN_IMG_SIZE);
      selectPawn(idx, canvas.toDataURL('image/png'));
    };
    img.onerror = () => toast("Impossible de lire cette image.");
    img.src = e.target.result;
  };
  reader.onerror = () => toast('Impossible de lire ce fichier.');
  reader.readAsDataURL(file);
  inputEl.value=''; // so choosing the same file again still fires onchange
}

function renderSetup() {
  const rows = document.getElementById('playerRows');
  rows.innerHTML = playerDefs.map((p,i) => `
    <div class="player-row">
      <input type="text" value="${p.name}" placeholder="Nom du joueur" oninput="playerDefs[${i}].name=this.value">
      <div class="pawn-pick">
        ${PAWN_EMOJIS.map(em=>`<div class="pawn-btn${p.pawn===em?' sel':''}" onclick="selectPawn(${i},'${em}')">${em}</div>`).join('')}
        <div class="pawn-btn pawn-btn-upload${isImagePawn(p.pawn)?' sel':''}" onclick="document.getElementById('pawnFile${i}').click()" title="${isImagePawn(p.pawn)?'Changer l\'image du pion':'Utiliser une image comme pion'}">${isImagePawn(p.pawn)?`<img src="${p.pawn}" class="pawn-btn-thumb" alt=""> Modifier`:'📷 Image'}</div>
        <input type="file" id="pawnFile${i}" accept="image/*" style="display:none" onchange="handlePawnFile(${i},this)">
      </div>
      ${playerDefs.length>2?`<button class="btn-sm red" onclick="removePlayerRow(${i})" style="padding:4px 8px;flex-shrink:0">✕</button>`:''}
    </div>
  `).join('');
  document.getElementById('addPlayerBtn').style.display = playerDefs.length>=6?'none':'';
  document.getElementById('btnStart').disabled = playerDefs.length < 2;
}

// File loading
document.getElementById('filePlateau').addEventListener('change', function(e) {
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=ev=>{

// Auto-load plateau.json / cartes.json from the same folder if the user
// hasn't manually picked a file. Silently keeps the built-in defaults if
// the files are missing or can't be fetched (e.g. page opened directly as
// a file:// document instead of served through a local server).
let plateauManuallyLoaded = false;
let cartesManuallyLoaded = false;

async function autoLoadDefaultFiles() {
  try {
    const res = await fetch('plateau.json', {cache:'no-store'});
    if(res.ok && !plateauManuallyLoaded) {
      const d = await res.json();
      boardData = d.board || d;
      document.getElementById('plateauBox').classList.add('loaded');
      document.getElementById('plateauStatus').textContent = '✓ Auto-chargé';
    }
  } catch(e) { /* pas de serveur local ou fichier absent → défaut conservé */ }

  try {
    const res = await fetch('cartes.json', {cache:'no-store'});
    if(res.ok && !cartesManuallyLoaded) {
      const d = await res.json();
      cardData = (d.chance && d.community) ? d : {chance:d.chance||[], community:d.community||[]};
      document.getElementById('cartesBox').classList.add('loaded');
      document.getElementById('cartesStatus').textContent = '✓ Auto-chargé';
    }
  } catch(e) { /* pas de serveur local ou fichier absent → défaut conservé */ }
}

let G = {}; // game state

function startGame() {
  const startMoney = parseInt(document.getElementById('startMoney').value)||1500;
  G = {
    players: playerDefs.map((p,i)=>({
      id:i, name:p.name, pawn:p.pawn,
      money:startMoney, pos:0,
      inJail:false, jailTurns:0,
      getOutCards:0,
      properties:[], // positions owned
      bankrupt:false,
    })),
    board: boardData,
    chanceCards: shuffle([...cardData.chance]),
    communityCards: shuffle([...cardData.community]),
    chanceIdx:0, communityIdx:0,
    currentPlayer:0,
    turn:1,
    phase:'roll', // roll | action | end
    pendingCard:null,
    diceRoll:null,
    doublesCount:0,
    propertyBuildings:{}, // pos -> {houses, hotel}
    mortgaged:new Set(),
    ui:{opponentsOpen:false, bankOpen:false},
    startedAt: performance.now(),
    pawnEls:{}, // player.id -> floating pawn-token DOM element (see buildBoard)
    animating:false, // true while a roll/move animation is in flight (blocks re-rolling)
  };
  document.getElementById('setupScreen').classList.add('hidden');
  document.getElementById('gameScreen').classList.remove('hidden');
  buildBoard();
  renderAll();
  log(`Partie lancée avec ${G.players.length} joueurs !`, 'system');
  log(`${pawnLogChar(G.players[0])} ${G.players[0].name} commence.`, 'important');
}

function shuffle(arr) {
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
  return arr;
}

function delay(ms){ return new Promise(resolve=>setTimeout(resolve, ms)); }

// Keep the floating pawn tokens aligned with their cells when the board is
// resized (the board's own size is fluid — see .board's width/height in
// CSS — so a pawn's last computed pixel position goes stale on resize).
window.addEventListener('resize', ()=>{
  if(document.getElementById('board') && G.pawnEls) positionAllPawnTokens();
});

// Session timer shown in the history panel header (mm:ss / hh:mm:ss).
setInterval(()=>{
  if(!G.startedAt) return;
  const secs=Math.floor((performance.now()-G.startedAt)/1000);
  const hh=Math.floor(secs/3600), mm=Math.floor((secs%3600)/60), ss=secs%60;
  const el=document.getElementById('historyTimer');
  if(el) el.textContent = `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
}, 1000);

// Whether the browser supports container query width units (cqw). Used to
// size cell icons relative to the actual rendered board (so the board looks
// right whatever the player's screen size), with a viewport-width fallback
// for older browsers that don't support cqw.
const SUPPORTS_CQW = (typeof CSS !== 'undefined' && CSS.supports && CSS.supports('width', '1cqw'));

// Currency icon: oufingouf.png replaces the "M$" symbol throughout the UI.
// Sized via the .currency-icon CSS class (1em) so it automatically matches
// the font-size of the amount it's displayed next to.
const MONEY_ICON = '<img src="images/oufingouf.png" alt="oufingouf" class="currency-icon">';
// Houses/hotels are "alertes"/"alerteprison" in this game (the two Discord
// reaction emotes of the community): buy up to 4 alertes on a property of a
// complete color set, then convert them into one alerteprison. The data keys
// stay houses/hotel/buildCost/perHouse/perHotel so plateau.json, cartes.json
// and the multiplayer server keep working unchanged — only the UI wording and
// visuals changed.
const ALERTE_SRC = 'images/alerte.png';
const ALERTEPRISON_SRC = 'images/alerteprison.png';
const ALERTE_ICON = `<img src="${ALERTE_SRC}" alt="alerte" class="inline-alert">`;
const ALERTEPRISON_ICON = `<img src="${ALERTEPRISON_SRC}" alt="alerteprison" class="inline-alert">`;
// Substitutes any "M$" found in free-form text (card/cell descriptions
// coming from plateau.json / cartes.json) with the currency icon. Only use
// this on strings rendered via innerHTML — never on textContent targets.
function fmtM(str) { return String(str || '').split('M$').join(MONEY_ICON); }

// Render an icon for a cell: emoji string → span, URL/base64 → img
function renderCellIconHtml(src, large) {
  if(!src) return '';
  // Detect image: starts with http, https, data:image, or common extensions
  const isImage = /^(https?:\/\/|data:image)/i.test(src);
  if(isImage) {
    // Corner cells are ~1.8x the size of a regular cell, so their icon
    // (large=true) is sized as a much bigger share of the board's own
    // width (cqw) — it now scales up on big screens and down on small ones
    // instead of hitting a low fixed cap, filling more of the corner.
    const size = SUPPORTS_CQW
      ? (large ? 'clamp(34px,9.5cqw,100px)' : 'clamp(16px,3.2cqw,34px)')
      : (large ? 'clamp(30px,9vw,90px)' : 'clamp(14px,2.8vw,30px)');
    return `<img src="${src}" style="width:${size};height:${size};object-fit:cover;border-radius:2px;vertical-align:middle;flex-shrink:0" onerror="this.style.display='none'">`;
  }
  // Emoji or text
  return `<span style="font-size:${large?'1.8em':'1.1em'};line-height:1">${src}</span>`;
}

// A player's "pawn" is either a plain emoji character (the default) or an
// uploaded image, normalized to a small square data URL by handlePawnFile()
// — same convention as cell icons above, so it uses the same detection.
function isImagePawn(v){ return typeof v==='string' && /^(https?:\/\/|data:image)/i.test(v); }

// HTML for a pawn wherever markup is built with innerHTML. Sized in `em` (as
// with .currency-icon) so an uploaded image automatically matches whatever
// font-size the surrounding element already uses (sidebar avatar, board
// token, victory screen...) with no per-call-site size to keep in sync.
function pawnIconHtml(pawn){
  if(!pawn) return '';
  return isImagePawn(pawn)
    ? `<img src="${pawn}" class="pawn-img-icon" alt="" onerror="this.style.display='none'">`
    : pawn;
}

// Plain-text stand-in for a pawn, for the few spots that set text directly
// (textContent) or feed into log() — log() deliberately uses textContent,
// never innerHTML, to keep freely-typed player names from being able to
// inject markup (see log()'s own comment) — so a data: URL can't be
// rendered as an image there; this substitutes a generic marker instead of
// dumping the raw URL as visible text.
function pawnLogChar(p){ return p && isImagePawn(p.pawn) ? '🔹' : (p ? p.pawn : ''); }

// BOARD RENDERING
// ══════════════════════════════════════════════════════════════════════════════

// Board layout: pos 0-9 = bottom row (right to left), 10-19 = left column (bottom to top),
// 20-29 = top row (left to right), 30-39 = right column (top to bottom)
function cellGridPos(pos) {
  if(pos>=0&&pos<=10) return {col:10-pos+1,row:11};       // bottom: col 11..1, row 11
  if(pos>=11&&pos<=19) return {col:1,row:11-(pos-10)};    // left: col 1, row 10..2
  if(pos>=20&&pos<=30) return {col:pos-20+1,row:1};       // top: col 1..11, row 1
  if(pos>=31&&pos<=39) return {col:11,row:pos-30+1};      // right: col 11, row 2..10
  return {col:1,row:1};
}

function buildBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  const cells = {};

  // Which edge a (non-corner) cell sits on, so its content can be rotated to
  // face outward: top row upside down, left/right columns rotated ±90°,
  // bottom row left as-is (see cellGridPos for the pos ranges per edge).
  function cellSide(pos) {
    if(pos>=1&&pos<=9) return 'bottom';
    if(pos>=11&&pos<=19) return 'left';
    if(pos>=21&&pos<=29) return 'top';
    if(pos>=31&&pos<=39) return 'right';
    return '';
  }

  G.board.forEach(c => {
    const {col,row} = cellGridPos(c.pos);
    const div = document.createElement('div');
    const isCorner = [0,10,20,30].includes(c.pos);
    div.className='cell'+(isCorner?'':' cell-side-'+cellSide(c.pos));
    div.id=`cell-${c.pos}`;
    div.style.gridColumn=col;
    div.style.gridRow=row;

    const color = GROUP_COLORS[c.group]||'#444';

    if(isCorner) {
      const cornerIcons = {0:'⛩',10:'🤸',20:'🍺',30:'🚔'};
      const labels = {0:'ENTRÉE SANCTUAIRE',10:'GYMNASE',20:'POCO BAR',30:'BAN DU SERVEUR'};
      // Support custom corner icon override via c.icon
      const cornerIconHtml = renderCellIconHtml(c.icon || cornerIcons[c.pos], true);
      div.innerHTML=`<div class="cell-content"><div class="cell-corner">${cornerIconHtml}<div class="lbl">${labels[c.pos]}</div></div></div>`;
    } else {
      let inner = '';
      if(c.type==='property'||c.type==='station'||c.type==='utility'){
        inner=`<div class="cell-color" style="background:${color}"></div>`;
      }
      // Default type icons, overridden by c.icon if present
      const defaultIcon = {chance:'❓',community:'🏘️',tax:'💸',goto_jail:'🚔',free:'🌳',custom:'⭐'}[c.type]||'';
      const iconSrc = c.icon || defaultIcon;
      const iconHtml = iconSrc ? renderCellIconHtml(iconSrc, false) + ' ' : '';
      // Name + price are grouped into one .cell-text block so they move
      // together as a unit, glued to the board's outer edge, while the
      // color band (if any) is glued to the inner edge — see the
      // .cell-content:has(.cell-color) CSS rule.
      let text = `<div class="cell-name">${iconHtml}${c.name}</div>`;
      if(c.price>0) text += `<div class="cell-price">${c.price}${MONEY_ICON}</div>`;
      inner += `<div class="cell-text">${text}</div>`;
      div.innerHTML=`<div class="cell-content">${inner}</div>`;
    }
    div.onclick=()=>showCellInfo(c.pos);
    cells[c.pos]=div;
    board.appendChild(div);
  });

  // Center
  const center = document.createElement('div');
  center.className='cell-center';
  center.innerHTML=`<div class="center-title">MONOPOLY</div><div class="center-sub">Jeu custom</div>`;
  board.appendChild(center);

  // Floating layer pawns live in (see #pawnLayer / .pawn-token in CSS and
  // ensurePawnTokens()/walkPawn() below) — appended last so it's on top of
  // every cell.
  const pawnLayer=document.createElement('div');
  pawnLayer.id='pawnLayer';
  board.appendChild(pawnLayer);
  G.pawnEls={};
}

// Pawns are floating tokens (see #pawnLayer / .pawn-token in CSS) positioned
// with transform:translate() to a pixel point read off the real DOM cell —
// see positionAllPawnTokens()/cellCenterPx() and the animated walkPawn()
// used for dice-driven moves further below.
function renderPawns() {
  const live=G.players.filter(p=>!p.bankrupt);
  const haveIds=Object.keys(G.pawnEls||{});
  const mismatched = haveIds.length!==live.length || live.some(p=>!G.pawnEls[p.id]);
  if(mismatched) ensurePawnTokens();
  else positionAllPawnTokens();
}

function ensurePawnTokens(){
  const layer=document.getElementById('pawnLayer');
  if(!layer) return;
  layer.innerHTML='';
  G.pawnEls={};
  G.players.filter(p=>!p.bankrupt).forEach(p=>{
    const el=document.createElement('div');
    el.className='pawn-token';
    el.innerHTML=pawnIconHtml(p.pawn);
    layer.appendChild(el);
    G.pawnEls[p.id]=el;
  });
  positionAllPawnTokens();
}

// Snap every pawn token to its player's current .pos (no animation — used
// after a state change that isn't a dice-driven move, and to re-align on
// resize). Players sharing a cell are fanned out slightly so they don't
// stack exactly on top of each other.
function positionAllPawnTokens(){
  const board=document.getElementById('board');
  if(!board) return;
  const boardRect=board.getBoundingClientRect();
  const groups={};
  G.players.forEach(p=>{ if(!p.bankrupt) (groups[p.pos]=groups[p.pos]||[]).push(p); });
  Object.values(groups).forEach(list=>{
    list.forEach((p,i)=>{
      const el=G.pawnEls[p.id];
      if(!el) return;
      const {x,y}=cellCenterPx(p.pos, boardRect, list.length, i);
      el.style.transition='none';
      el.style.transform=`translate(calc(${x}px - 50%), calc(${y}px - 50%))`;
      el.offsetHeight; // flush the style change before transitions are re-enabled
      el.style.transition='';
    });
  });
}

// Pixel center of cell `pos` relative to the board's own box. `count`/`index`
// fan multiple co-located pawns out around that center instead of stacking.
function cellCenterPx(pos, boardRect, count, index){
  const cellEl=document.getElementById(`cell-${pos}`);
  if(!cellEl) return {x:boardRect.width/2, y:boardRect.height/2};
  const r=cellEl.getBoundingClientRect();
  const cx=r.left-boardRect.left+r.width/2;
  const cy=r.top-boardRect.top+r.height/2;
  if(count<=1) return {x:cx, y:cy};
  const angle=(index/count)*Math.PI*2 - Math.PI/2;
  const spread=Math.min(r.width, r.height)*0.26;
  return {x:cx+Math.cos(angle)*spread, y:cy+Math.sin(angle)*spread};
}

// Build the ordered list of cells a pawn passes through to go `steps`
// forward (positive) or backward (negative) from `fromPos`, wrapping
// correctly around the 40-cell track in either direction.
function pathForSteps(fromPos, steps){
  const dir = steps>=0 ? 1 : -1;
  const n = Math.abs(steps);
  const path=[];
  let cur=fromPos;
  for(let i=0;i<n;i++){ cur=((cur+dir)%40+40)%40; path.push(cur); }
  return path;
}

// Animate a pawn hopping through each cell in `path` in turn (purely
// visual — doesn't touch p.pos). Resolves once the last hop's transition
// finishes. The whole walk is capped at PAWN_HOP_MAX_TOTAL_MS so a long
// forced move (e.g. a card sending someone most of the way around the
// board) doesn't take forever — each hop just gets shorter.
function walkPawn(p, path){
  return new Promise(resolve=>{
    const el=G.pawnEls&&G.pawnEls[p.id];
    if(!el || !path.length){ resolve(); return; }
    const board=document.getElementById('board');
    const stepMs=Math.max(55, Math.min(PAWN_HOP_MS, PAWN_HOP_MAX_TOTAL_MS/path.length));
    el.style.transition=`transform ${stepMs}ms linear`;
    el.style.zIndex=10;
    let i=0;
    (function hop(){
      const boardRect=board.getBoundingClientRect();
      const {x,y}=cellCenterPx(path[i], boardRect, 1, 0);
      el.style.transform=`translate(calc(${x}px - 50%), calc(${y}px - 50%))`;
      i++;
      if(i<path.length){ setTimeout(hop, stepMs); }
      else { setTimeout(()=>{ el.style.zIndex=''; el.style.transition=''; resolve(); }, stepMs); }
    })();
  });
}

function groupPipsHtml(player){
  const order=['brown','lblue','pink','orange','red','yellow','green','blue'];
  let html='<div class="grp-grid">';
  order.forEach(g=>{
    const cells=G.board.filter(c=>c.group===g && c.type==='property');
    if(!cells.length) return;
    html+='<div class="grp-row">'+cells.map(c=>{
      const owned=player.properties.includes(c.pos);
      return `<span class="grp-pip${owned?' filled':''}" style="--pc:${GROUP_COLORS[g]}" title="${c.name}"></span>`;
    }).join('')+'</div>';
  });
  const stations=G.board.filter(c=>c.type==='station');
  if(stations.length){
    html+='<div class="grp-row">'+stations.map(c=>{
      const owned=player.properties.includes(c.pos);
      return `<span class="grp-pip${owned?' filled':''}" style="--pc:#4a5a56" title="${c.name}"></span>`;
    }).join('')+'</div>';
  }
  const utilities=G.board.filter(c=>c.type==='utility');
  if(utilities.length){
    html+='<div class="grp-row">'+utilities.map(c=>{
      const owned=player.properties.includes(c.pos);
      return `<span class="grp-pip${owned?' filled':''}" style="--pc:#2f7ab8" title="${c.name}"></span>`;
    }).join('')+'</div>';
  }
  html+='</div>';
  return html;
}

function renderQuickActions(p){
  let html='';
  if(p.inJail && G.phase==='roll'){
    html+=`<button class="btn-sm warn" onclick="payJail()">⛓️ Payer la caution (${MONEY_ICON}50)</button>`;
    if(p.getOutCards>0) html+=`<button class="btn-sm green" onclick="useGetOutCard()">🔑 Carte sortie de prison</button>`;
  }
  if(G.phase==='action'){
    html+=`<button class="btn-sm" onclick="endTurn()">⏭ Fin de tour</button>`;
    html+=`<button class="btn-sm red" onclick="declareBankrupt()">🏳️ Déclarer faillite</button>`;
  }
  return html?`<div class="quick-actions">${html}</div>`:'';
}

function opponentRowHtml(o){
  return `<div class="opp-row${o.bankrupt?' bankrupt':''}">
    <span class="opp-pawn">${pawnIconHtml(o.pawn)}</span>
    <span class="opp-name">${o.name}${o.inJail?' ⛓️':''}${o.bankrupt?' (faillite)':''}</span>
    <span class="opp-props">${o.properties.length} biens</span>
    <span class="opp-money">${MONEY_ICON}${o.money.toLocaleString()}</span>
  </div>`;
}

function bankStatsHtml(){
  const dealCells = G.board.filter(c=>['property','station','utility'].includes(c.type));
  const owned = dealCells.filter(c=>isOwned(c.pos)).length;
  const available = dealCells.length-owned;
  const circulating = G.players.filter(p=>!p.bankrupt).reduce((s,p)=>s+p.money,0);
  let houses=0, hotels=0;
  Object.values(G.propertyBuildings).forEach(b=>{houses+=b.houses||0; if(b.hotel) hotels++;});
  return `
    <div class="info-row"><span class="lbl">Propriétés disponibles</span><span class="val">${available} / ${dealCells.length}</span></div>
    <div class="info-row"><span class="lbl">Argent en circulation</span><span class="val">${MONEY_ICON}${circulating.toLocaleString()}</span></div>
    <div class="info-row"><span class="lbl">${ALERTE_ICON} Alertes en jeu</span><span class="val">${houses}</span></div>
    <div class="info-row"><span class="lbl">${ALERTEPRISON_ICON} Alertesprison en jeu</span><span class="val">${hotels}</span></div>
  `;
}

function toggleOpponents(){ G.ui.opponentsOpen=!G.ui.opponentsOpen; renderSidebarPanels(); }
function toggleBank(){ G.ui.bankOpen=!G.ui.bankOpen; renderSidebarPanels(); }

function renderSidebarPanels(){
  const el=document.getElementById('sidebarPanels');
  const p=G.players[G.currentPlayer];
  const others=G.players.filter(pl=>pl.id!==p.id);

  el.innerHTML = `
    <div class="panel panel-active">
      <div class="pa-top">
        <span class="pa-pawn">${pawnIconHtml(p.pawn)}</span>
        <span class="pa-name">${p.name}${p.inJail?' <span class="jail-badge">⛓️ prison</span>':''}</span>
        <span class="pa-money">${MONEY_ICON}${p.money.toLocaleString()}</span>

    </div>

      <div class="panel-header" onclick="toggleBank()">

      </div>
      ${G.ui.bankOpen?`<div class="panel-content">${bankStatsHtml()}</div>`:''}

function renderConsoleBar(){
  const p=G.players[G.currentPlayer];
  const inAction = G.phase==='action';
  const ownsBuildable = p.properties.some(pos=>{
    const cell=G.board[pos]; if(!cell||cell.type!=='property') return false;
    const group=G.board.filter(c=>c.group===cell.group&&c.type==='property');
    return group.every(c=>p.properties.includes(c.pos));
  });
  const ownsBuildings = p.properties.some(pos=>{const b=G.propertyBuildings[pos]; return b&&(b.houses>0||b.hotel);});
  const ownsMortgageable = p.properties.some(pos=>!G.mortgaged.has(pos));
  const ownsMortgaged = p.properties.some(pos=>G.mortgaged.has(pos));

  document.getElementById('btnConsoleBuild').disabled = !(inAction&&ownsBuildable);
  document.getElementById('btnConsoleSell').disabled = !(inAction&&ownsBuildings);
  document.getElementById('btnConsoleMortgage').disabled = !(inAction&&ownsMortgageable);
  document.getElementById('btnConsoleUnmortgage').disabled = !(inAction&&ownsMortgaged);
  document.getElementById('btnRoll').disabled = G.phase!=='roll';
}

// Draws the alertes (up to 4) or the alerteprison of each property inside the
// color band of its board cell. Cheap: only touches a band if its content changed.
function renderCellAlerts(){
  G.board.forEach(c=>{
    if(c.type!=='property') return;
    const band=document.querySelector(`#cell-${c.pos} .cell-color`);
    if(!band) return;
    const b=G.propertyBuildings[c.pos]||{houses:0,hotel:0};
    let html='';
    if(b.hotel) html=`<img class="cell-alert prison" src="${ALERTEPRISON_SRC}" alt="alerteprison">`;
    else if(b.houses>0) html=`<img class="cell-alert" src="${ALERTE_SRC}" alt="alerte">`.repeat(b.houses);
    if(band.dataset.alerts!==html){
      band.innerHTML=html;
      band.dataset.alerts=html;
      band.classList.toggle('has-alerts',!!html);
    }
  });
}

function renderAll(){
  renderPawns();
  renderCellAlerts();
  renderSidebarPanels();
  renderConsoleBar();
  document.getElementById('turnNum').textContent=G.turn;
}

// DICE & MOVEMENT
// ══════════════════════════════════════════════════════════════════════════════

const PAWN_HOP_MS = 140;            // duration of one cell-to-cell hop
const PAWN_HOP_MAX_TOTAL_MS = 1400; // cap on a whole walk's duration, however many hops

// Flash both the small console dice and the big center-screen dice through
// random faces, then settle on d1/d2 and hold briefly before fading the
// center overlay out. Returns a promise so rollDice() can wait for the
// "drama" to finish before the pawn actually starts moving.
function animateDiceRoll(d1, d2){
  return new Promise(resolve=>{
    const dice1El=document.getElementById('dice1');
    const dice2El=document.getElementById('dice2');
    const overlay=document.getElementById('diceOverlay');
    const big1=document.getElementById('bigDice1');
    const big2=document.getElementById('bigDice2');
    const bigTotal=document.getElementById('bigDiceTotal');

    [dice1El,dice2El,big1,big2].forEach(el=>el.classList.add('rolling'));
    bigTotal.textContent='';
    overlay.classList.add('show');

    let flashCount=0;
    const flashInterval=setInterval(()=>{
      const f1=DICE_FACES[Math.floor(Math.random()*6)];
      const f2=DICE_FACES[Math.floor(Math.random()*6)];
      dice1El.textContent=f1; dice2El.textContent=f2;
      big1.textContent=f1; big2.textContent=f2;
      flashCount++;
      if(flashCount>=8){
        clearInterval(flashInterval);
        const face1=DICE_FACES[d1-1], face2=DICE_FACES[d2-1];
        dice1El.textContent=face1; dice2El.textContent=face2;
        big1.textContent=face1; big2.textContent=face2;
        [dice1El,dice2El,big1,big2].forEach(el=>el.classList.remove('rolling'));
        document.getElementById('diceTotal').textContent=d1+d2;
        bigTotal.textContent=d1+d2;
        setTimeout(()=>{
          overlay.classList.remove('show');
          setTimeout(resolve, 220); // matches .dice-overlay's opacity transition
        }, 450); // hold the final faces on screen before fading out
      }
    }, 70);
  });
}

async function rollDice(){
  if(G.phase!=='roll' || G.animating) return;
  G.animating=true;
  document.getElementById('btnRoll').disabled=true;

  const p=G.players[G.currentPlayer];
  const d1=Math.ceil(Math.random()*6), d2=Math.ceil(Math.random()*6);
  const total=d1+d2;
  const doubles=d1===d2;

  await animateDiceRoll(d1,d2);

  G.diceRoll=[d1,d2];
  log(`${pawnLogChar(p)} ${p.name} lance : ${DICE_FACES[d1-1]}+${DICE_FACES[d2-1]} = ${total}${doubles?' (doubles!)':''}`, 'move');

  if(p.inJail){
    if(doubles){p.inJail=false;p.jailTurns=0;log(`${pawnLogChar(p)} Sort de prison grâce aux doubles !`,'gain');}
    else{
      p.jailTurns++;
      if(p.jailTurns>=3){p.inJail=false;p.jailTurns=0;p.money-=50;log(`${pawnLogChar(p)} Sort de prison après 3 tours. Paye M$50.`,'loss');}
      else{
        log(`${pawnLogChar(p)} En prison — tour ${p.jailTurns}/3.`);
        G.phase='action';
        G.animating=false;
        renderAll();
        return;
      }
    }
  }

  if(doubles){
    G.doublesCount++;
    if(G.doublesCount>=3){
      goToJail(p);
      G.phase='action';
      G.animating=false;
      renderAll();
      return;
    }
  } else {
    G.doublesCount=0;
  }

  await movePlayer(p, total);
  G.animating=false;
}

// Walks the pawn cell-by-cell to its new position (see walkPawn()), then
// applies the "passed Go" bonus and hands off to landOn(). Awaited by
// rollDice() for a normal roll, but also called fire-and-forget by card
// effects (move_to/move_by) — either way the animation still plays.
async function movePlayer(p, steps){
  const oldPos=p.pos;
  const path=pathForSteps(oldPos, steps);
  const newPos=path.length?path[path.length-1]:oldPos;
  G.phase='action';
  renderSidebarPanels();
  renderConsoleBar();
  await walkPawn(p, path);
  p.pos=newPos;
  // newPos!==0 excludes landing *exactly* on the Départ cell: that case is
  // handled by landOn()'s own 'go' branch below, which also grants M$200 —
  // without this guard, a move that lands precisely on 0 would pay the
  // bonus twice (once here for "passed through 0", once for "arrived on
  // the Départ cell"). Only an actual pass-through (0 crossed mid-path,
  // final position elsewhere) should trigger this bonus.
  if(steps>0 && newPos!==0 && path.includes(0)){
    p.money+=200;
    log(`${pawnLogChar(p)} Passe par la case Départ → reçoit M$200`,'gain');
  }
  renderAll();
  await delay(150);
  landOn(p);
}

function landOn(p){
  const cell=G.board[p.pos];
  if(!cell) return;
  log(`${pawnLogChar(p)} arrive sur : ${cell.name}`,'move');

  switch(cell.type){
    case 'go':
      p.money+=200;
      log(`${pawnLogChar(p)} Case Départ → reçoit M$200`,'gain');
      break;
    case 'tax':
      p.money-=cell.price;
      log(`${pawnLogChar(p)} Taxe : paye M$${cell.price}`,'loss');
      break;
    case 'goto_jail':
      goToJail(p);
      break;
    case 'jail': case 'free':
      log(`${pawnLogChar(p)} Simple visite.`);
      break;
    case 'chance':
      drawCard(p,'chance');
      break;
    case 'community':
      drawCard(p,'community');
      break;
    case 'property': case 'station': case 'utility':
      handlePropertyLanding(p,cell);
      break;
  }
  renderAll();
}

function goToJail(p){
  p.pos=10; p.inJail=true; p.jailTurns=0;
  log(`⛓️ ${pawnLogChar(p)} ${p.name} est envoyé en prison !`,'loss');
}

// CARDS

function drawCard(p,deck){
  const cards=deck==='chance'?G.chanceCards:G.communityCards;
  if(!cards||cards.length===0){log('Paquet vide.');return;}
  const idx=deck==='chance'?G.chanceIdx:G.communityIdx;
  const card=cards[idx%cards.length];
  if(deck==='chance') G.chanceIdx++;
  else G.communityIdx++;

  log(`${pawnLogChar(p)} Tire une carte ${deck==='chance'?'Chance':'Communauté'} : "${card.text}"`, 'chance');
  applyCard(p, card, deck);
}

function applyCard(p, card, deck){
  const others=G.players.filter(pl=>!pl.bankrupt&&pl.id!==p.id);
  let amountBadge='';
  let applyFn=()=>{};

  switch(card.effect){
    case 'gain':
      applyFn=()=>{p.money+=card.amount;log(`${pawnLogChar(p)} Reçoit M$${card.amount}`,'gain');};
      amountBadge=`<div class="card-display-amount pos">+ ${MONEY_ICON}${card.amount}</div>`;
      break;
    case 'lose':
      applyFn=()=>{p.money-=card.amount;log(`${pawnLogChar(p)} Paie M$${card.amount}`,'loss');};
      amountBadge=`<div class="card-display-amount neg">- ${MONEY_ICON}${card.amount}</div>`;
      break;
    case 'goto_jail':
      applyFn=()=>goToJail(p);
      amountBadge=`<div style="font-size:30px">⛓️</div>`;
      break;
    case 'goto_direct':
      // Instant reposition to an arbitrary cell, no walk animation and no
      // "passed Go" bonus even if the straight-line path would have crossed
      // position 0 — same convention as goto_jail above (a direct send is
      // not a real board movement), but the destination is whatever
      // card.targetPos says instead of being hardcoded to the jail cell.
      applyFn=()=>{
        const target=card.targetPos||0;
        p.pos=target;
        log(`${pawnLogChar(p)} Est envoyé directement case ${target} : ${G.board[target]?.name}`,'move');
        landOn(p);
      };
      amountBadge=`<div style="font-size:22px">⇢ case ${card.targetPos}</div>`;
      break;
    case 'get_out':
      applyFn=()=>{p.getOutCards++;log(`${pawnLogChar(p)} Obtient une carte sortie de prison.`,'gain');};
      amountBadge=`<div style="font-size:30px">🔑</div>`;
      break;
    case 'move_to':
      applyFn=()=>{
        const target=card.targetPos||0;
        // "Advance to X" always moves forward (wrapping past Go awards the
        // usual M$200) — movePlayer() walks the pawn there and calls
        // landOn() itself once it arrives, animation included.
        const steps=(target-p.pos+40)%40;
        log(`${pawnLogChar(p)} Se déplace case ${target} : ${G.board[target]?.name}`,'move');
        movePlayer(p,steps);
      };
      amountBadge=`<div style="font-size:24px">→ case ${card.targetPos}</div>`;
      break;
    case 'move_by':
      applyFn=()=>{
        const steps=card.moveSteps||0;
        movePlayer(p,steps);
        log(`${pawnLogChar(p)} Avance de ${steps} cases`,'move');
      };
      amountBadge=`<div style="font-size:20px">${card.moveSteps>0?'+':''}${card.moveSteps} cases</div>`;
      break;
    case 'repairs':
      applyFn=()=>{
        let total=0;
        p.properties.forEach(pos=>{
          const b=G.propertyBuildings[pos]||{houses:0,hotel:0};
          total+=b.houses*card.perHouse+b.hotel*card.perHotel;
        });
        p.money-=total;
        log(`${pawnLogChar(p)} Réparations : paye M$${total}`,'loss');
      };
      amountBadge=`<div style="font-size:13px;color:#888">${ALERTE_ICON} ${MONEY_ICON}${card.perHouse}/alerte<br>${ALERTEPRISON_ICON} ${MONEY_ICON}${card.perHotel}/alerteprison</div>`;
      break;
    case 'birthday': case 'collect_all':
      applyFn=()=>{
        const amt=card.collectAmount||card.amount||0;
        others.forEach(o=>{o.money-=amt;});
        p.money+=amt*others.length;
        log(`${pawnLogChar(p)} Collecte M$${amt} de chaque joueur → total M$${amt*others.length}`,'gain');
      };
      amountBadge=`<div class="card-display-amount pos">+ ${MONEY_ICON}${card.collectAmount||card.amount} × joueurs</div>`;
      break;
    case 'pay_all':
      applyFn=()=>{
        const amt=card.amount||0;
        others.forEach(o=>{o.money+=amt;});
        p.money-=amt*others.length;
        log(`${pawnLogChar(p)} Verse M$${amt} à chaque joueur`,'loss');
      };
      amountBadge=`<div class="card-display-amount neg">- ${MONEY_ICON}${card.amount} × joueurs</div>`;
      break;
    case 'pay_or_chance':
      // The only card effect that isn't a single deterministic outcome: the
      // player picks between paying a fixed fine or drawing a Chance card
      // instead. showCardModal()'s single "OK" button can't express a
      // choice, so this bypasses it entirely and shows its own two-button
      // modal (see showChoiceModal below), then returns immediately.
      showChoiceModal(p, card, deck);
      return;
    default:
      applyFn=()=>{log(`${pawnLogChar(p)} Carte spéciale : ${card.text}`,'chance');};
  }

  showCardModal(card, deck, amountBadge, applyFn);
}

function showCardModal(card, deck, amountBadge, applyFn){
  const isChance=deck==='chance';
  document.getElementById('modalTitle').textContent=isChance?'🃏 Chance':'🏘️ Communauté';
  document.getElementById('modalBody').innerHTML=`
    <div class="card-display ${deck}">
      <div class="card-display-deck">${isChance?'CHANCE':'COMMUNAUTÉ'}</div>
      <div class="card-display-icon">${card.icon||'🃏'}</div>
      <div class="card-display-text">${fmtM(card.text)}</div>
      ${amountBadge}
      ${card.flavor?`<div class="card-display-flavor">${fmtM(card.flavor)}</div>`:''}
    </div>
  `;
  document.getElementById('modalFooter').innerHTML=`
    <button class="btn-roll" style="font-size:16px;padding:10px 28px" onclick="confirmCard()">OK</button>
  `;
  G.pendingCard=applyFn;
  document.getElementById('modalOverlay').classList.remove('hidden');
}

function confirmCard(){
  if(G.pendingCard){G.pendingCard();G.pendingCard=null;}
  closeModal();
  renderAll();
}

// Two-button variant of showCardModal(), used only by the 'pay_or_chance'
// effect: the player explicitly picks "Payer" or "Tirer une carte Chance"
// instead of a single "OK" confirming one predetermined outcome. Player id
// (not the player object) is threaded through the onclick handlers since
// they're serialized into HTML strings.
function showChoiceModal(p, card, deck){
  const isChance=deck==='chance';
  document.getElementById('modalTitle').textContent=isChance?'🃏 Chance':'🏘️ Communauté';
  document.getElementById('modalBody').innerHTML=`
    <div class="card-display ${deck}">
      <div class="card-display-deck">${isChance?'CHANCE':'COMMUNAUTÉ'}</div>
      <div class="card-display-icon">${card.icon||'🃏'}</div>
      <div class="card-display-text">${fmtM(card.text)}</div>
      <div class="card-display-amount neg">- ${MONEY_ICON}${card.amount} <span style="opacity:.6;font-size:.7em">ou tirer Chance</span></div>
      ${card.flavor?`<div class="card-display-flavor">${fmtM(card.flavor)}</div>`:''}
    </div>
  `;
  document.getElementById('modalFooter').innerHTML=`
    <button class="btn-roll" style="font-size:14px;padding:9px 18px" onclick="resolveChoicePay(${p.id},${card.amount})">Payer ${MONEY_ICON}${card.amount}</button>
    <button class="btn-roll" style="font-size:14px;padding:9px 18px;background:#e8a830" onclick="resolveChoiceDraw(${p.id})">🃏 Tirer une carte Chance</button>
  `;
  document.getElementById('modalOverlay').classList.remove('hidden');
}

function resolveChoicePay(playerId, amount){
  const p = G.players.find(pl=>pl.id===playerId);
  if(!p) return;
  p.money -= amount;
  log(`${pawnLogChar(p)} Choisit de payer M$${amount}`,'loss');
  closeModal();
  renderAll();
}

function resolveChoiceDraw(playerId){
  const p = G.players.find(pl=>pl.id===playerId);
  if(!p) return;
  log(`${pawnLogChar(p)} Choisit de tirer une carte Chance plutôt que payer`,'chance');
  closeModal();
  drawCard(p,'chance');
}

// PROPERTIES

function isOwned(pos){return G.players.some(p=>p.properties.includes(pos));}
function ownerOf(pos){return G.players.find(p=>p.properties.includes(pos));}

function handlePropertyLanding(p, cell){
  const owner=ownerOf(cell.pos);
  if(!owner){
    showBuyModal(p, cell);
    return;
  }
  if(owner.id===p.id){log(`${pawnLogChar(p)} C'est votre propriété.`);return;}
  if(G.mortgaged.has(cell.pos)){log(`${cell.name} est hypothéquée, pas de loyer.`);return;}

  const rent=calcRent(cell, owner);
  p.money-=rent;
  owner.money+=rent;
  log(`${pawnLogChar(p)} Paye loyer M$${rent} à ${pawnLogChar(owner)} ${owner.name} pour ${cell.name}`,'loss');
  renderSidebarPanels();
}

function calcRent(cell, owner){
  if(cell.type==='station'){
    const stationsOwned=owner.properties.filter(pos=>G.board[pos]?.type==='station').length;
    return cell.rents[Math.min(stationsOwned-1,3)]||25;
  }
  if(cell.type==='utility'){
    const utilitiesOwned=owner.properties.filter(pos=>G.board[pos]?.type==='utility').length;
    const diceTotal=G.diceRoll?G.diceRoll[0]+G.diceRoll[1]:7;
    return utilitiesOwned>=2?diceTotal*10:diceTotal*4;
  }
  const b=G.propertyBuildings[cell.pos]||{houses:0,hotel:0};
  if(b.hotel) return cell.rents[5];
  if(b.houses>0) return cell.rents[1+b.houses];
  // Check monopoly
  const groupProps=G.board.filter(c=>c.group===cell.group&&c.type==='property');
  const ownsAll=groupProps.every(c=>owner.properties.includes(c.pos));
  return ownsAll?cell.rents[1]:cell.rents[0];
}

function titleDeedHtml(cell, color){
  const rentRows = cell.type==='property' ? `
      <tr><td>Loyer nu</td><td>${MONEY_ICON}${cell.rents[0]}</td></tr>
      <tr><td>Avec le monopole</td><td>${MONEY_ICON}${cell.rents[1]}</td></tr>
      <tr><td>${ALERTE_ICON} Avec 1 alerte</td><td>${MONEY_ICON}${cell.rents[2]}</td></tr>
      <tr><td>${ALERTE_ICON} Avec 2 alertes</td><td>${MONEY_ICON}${cell.rents[3]}</td></tr>
      <tr><td>${ALERTE_ICON} Avec 3 alertes</td><td>${MONEY_ICON}${cell.rents[4]}</td></tr>
      <tr><td>${ALERTEPRISON_ICON} Avec alerteprison</td><td>${MONEY_ICON}${cell.rents[5]}</td></tr>
    ` : cell.type==='station' ? `
      <tr><td>1 gare</td><td>${MONEY_ICON}${cell.rents[0]}</td></tr>
      <tr><td>2 gares</td><td>${MONEY_ICON}${cell.rents[1]}</td></tr>
      <tr><td>3 gares</td><td>${MONEY_ICON}${cell.rents[2]}</td></tr>
      <tr><td>4 gares</td><td>${MONEY_ICON}${cell.rents[3]}</td></tr>
    ` : `<tr><td colspan="2">Loyer = dés × 4 (1 compagnie possédée) ou × 10 (2 compagnies)</td></tr>`;

  return `
    <div class="title-deed">
      <div class="td-band" style="background:${color}"></div>
      <div class="td-body">
        <div class="td-kicker">Titre de propriété</div>
        <div class="td-name">${cell.name}</div>
        <table class="prop-table">${rentRows}</table>
        ${cell.price?`<div class="td-foot">Hypothèque ${MONEY_ICON}${cell.mortgage}${cell.buildCost?` · Alerte ${MONEY_ICON}${cell.buildCost}`:''}</div>`:''}
      </div>
    </div>`;
}

function showBuyModal(p, cell){
  const color=GROUP_COLORS[cell.group]||'#888';
  const canAfford = p.money>=cell.price;
  document.getElementById('modalTitle').textContent='À vendre';
  document.getElementById('modalBody').innerHTML=`
    <div class="buy-price">${MONEY_ICON}${cell.price}</div>
    ${titleDeedHtml(cell, color)}
  `;
  document.getElementById('modalFooter').innerHTML=`
    <button class="btn-sm" onclick="closeModal()">Passer</button>
    <button class="btn-roll" style="flex:1" ${canAfford?'':'disabled'} onclick="buyProperty();closeModal()">Acheter</button>
  `;
  document.getElementById('modalOverlay').classList.remove('hidden');
}

function buyProperty(){
  const p=G.players[G.currentPlayer];
  const cell=G.board[p.pos];
  if(!cell||p.money<cell.price) return;
  p.money-=cell.price;
  p.properties.push(cell.pos);
  log(`${pawnLogChar(p)} ${p.name} achète ${cell.name} pour M$${cell.price}`,'gain');
  renderAll();
}

function showBuildModal(){
  const p=G.players[G.currentPlayer];
  const buildable=p.properties.filter(pos=>{
    const cell=G.board[pos];
    if(!cell||cell.type!=='property') return false;
    const group=G.board.filter(c=>c.group===cell.group&&c.type==='property');
    return group.every(c=>p.properties.includes(c.pos));
  });
  if(buildable.length===0){
    showInfo('Alertes','Vous devez posséder toutes les propriétés d\'une même couleur pour acheter des alertes.');
    return;
  }
  const rows=buildable.map(pos=>{
    const cell=G.board[pos];
    const b=G.propertyBuildings[pos]||{houses:0,hotel:0};
    const current=b.hotel?`${ALERTEPRISON_ICON} Alerteprison`:b.houses>0?`${ALERTE_ICON}×${b.houses}`:'Aucune alerte';
    const canBuild=!b.hotel&&b.houses<4?`<button class="btn-sm green" onclick="buildHouse(${pos})">+ ${ALERTE_ICON} Alerte (${MONEY_ICON}${cell.buildCost})</button>`:'';
    const canHotel=b.houses>=4&&!b.hotel?`<button class="btn-sm warn" onclick="buildHotel(${pos})">${ALERTEPRISON_ICON} Convertir en alerteprison (${MONEY_ICON}${cell.buildCost})</button>`:'';
    return `<div class="info-row"><span class="lbl">${cell.name}</span><span style="display:flex;align-items:center;gap:6px">${current} ${canBuild}${canHotel}</span></div>`;
  }).join('');
  document.getElementById('modalTitle').innerHTML=`${ALERTE_ICON} Alertes`;
  document.getElementById('modalBody').innerHTML=rows;
  document.getElementById('modalFooter').innerHTML=`<button class="btn-sm" onclick="closeModal()">Fermer</button>`;
  document.getElementById('modalOverlay').classList.remove('hidden');
}

function buildHouse(pos){
  const p=G.players[G.currentPlayer];
  const cell=G.board[pos];
  if(p.money<cell.buildCost){toast('Fonds insuffisants.');return;}
  if(!G.propertyBuildings[pos]) G.propertyBuildings[pos]={houses:0,hotel:0};
  if(G.propertyBuildings[pos].houses>=4) return;
  p.money-=cell.buildCost;
  G.propertyBuildings[pos].houses++;
  log(`${pawnLogChar(p)} Achète une alerte sur ${cell.name}`,'gain');
  renderAll(); showBuildModal();
}

function buildHotel(pos){
  const p=G.players[G.currentPlayer];
  const cell=G.board[pos];
  if(p.money<cell.buildCost){toast('Fonds insuffisants.');return;}
  p.money-=cell.buildCost;
  G.propertyBuildings[pos]={houses:0,hotel:1};
  log(`${pawnLogChar(p)} Convertit ses 4 alertes en alerteprison sur ${cell.name}`,'gain');
  renderAll(); showBuildModal();
}

// Sell alertes/alerteprison (houses/hotels) back to the bank at half of their build cost — the
// official Monopoly rule for the "Vendre" button (there is no rule for
// selling a property title itself back to the bank, only mortgaging it).
function showSellModal(){
  const p=G.players[G.currentPlayer];
  const rows=p.properties.filter(pos=>{
    const b=G.propertyBuildings[pos]; return b&&(b.houses>0||b.hotel);
  }).map(pos=>{
    const cell=G.board[pos];
    const b=G.propertyBuildings[pos];
    const refund=Math.round(cell.buildCost/2);
    const btn = b.hotel
      ? `<button class="btn-sm red" onclick="sellHotel(${pos})">Vendre l'alerteprison (+${MONEY_ICON}${refund})</button>`
      : `<button class="btn-sm red" onclick="sellHouse(${pos})">Vendre 1 alerte (+${MONEY_ICON}${refund})</button>`;
    const state = b.hotel?`${ALERTEPRISON_ICON} Alerteprison`:`${ALERTE_ICON}×${b.houses}`;
    return `<div class="info-row"><span class="lbl">${cell.name} <span style="color:var(--text3)">(${state})</span></span><span>${btn}</span></div>`;
  }).join('');
  document.getElementById('modalTitle').textContent='💰 Vendre des alertes';
  document.getElementById('modalBody').innerHTML=rows||'<div style="color:var(--text3);font-size:13px">Aucune alerte à vendre. Il faut posséder des alertes ou une alerteprison.</div>';
  document.getElementById('modalFooter').innerHTML=`<button class="btn-sm" onclick="closeModal()">Fermer</button>`;
  document.getElementById('modalOverlay').classList.remove('hidden');
}

function sellHouse(pos){
  const p=G.players[G.currentPlayer];
  const cell=G.board[pos];
  const b=G.propertyBuildings[pos];
  if(!b||b.houses<=0) return;
  const refund=Math.round(cell.buildCost/2);
  b.houses--; p.money+=refund;
  log(`${pawnLogChar(p)} Vend une alerte sur ${cell.name} (+M$${refund})`,'gain');
  renderAll(); showSellModal();
}

function sellHotel(pos){
  const p=G.players[G.currentPlayer];
  const cell=G.board[pos];
  const b=G.propertyBuildings[pos];
  if(!b||!b.hotel) return;
  const refund=Math.round(cell.buildCost/2);
  b.hotel=0; b.houses=4; p.money+=refund;
  log(`${pawnLogChar(p)} Vend l'alerteprison sur ${cell.name} (revient à 4 alertes) (+M$${refund})`,'gain');
  renderAll(); showSellModal();
}

function showMortgageModal(mode){
  mode = mode||'mortgage';
  const p=G.players[G.currentPlayer];
  const list=p.properties.filter(pos=> mode==='unmortgage' ? G.mortgaged.has(pos) : !G.mortgaged.has(pos));
  const rows=list.map(pos=>{
    const cell=G.board[pos];
    const btn = mode==='unmortgage'
      ? `<button class="btn-sm green" onclick="unmortgage(${pos})">Lever (${MONEY_ICON}${Math.round(cell.mortgage*1.1)})</button>`
      : `<button class="btn-sm red" onclick="mortgage(${pos})">Hypothéquer (+${MONEY_ICON}${cell.mortgage})</button>`;
    return `<div class="info-row"><span class="lbl">${cell.name}</span><span>${btn}</span></div>`;
  }).join('');
  document.getElementById('modalTitle').textContent = mode==='unmortgage' ? "🔓 Lever l'hypothèque" : '🏦 Hypothéquer';
  document.getElementById('modalBody').innerHTML=rows||`<div style="color:var(--text3);font-size:13px">Aucune propriété concernée.</div>`;
  document.getElementById('modalFooter').innerHTML=`<button class="btn-sm" onclick="closeModal()">Fermer</button>`;
  document.getElementById('modalOverlay').classList.remove('hidden');
}

function mortgage(pos){
  const p=G.players[G.currentPlayer];
  G.mortgaged.add(pos);
  p.money+=G.board[pos].mortgage;
  log(`${pawnLogChar(p)} Hypothèque ${G.board[pos].name} → reçoit M$${G.board[pos].mortgage}`,'gain');
  renderAll(); showMortgageModal('mortgage');
}
function unmortgage(pos){
  const p=G.players[G.currentPlayer];
  const cost=Math.round(G.board[pos].mortgage*1.1);
  if(p.money<cost){toast('Fonds insuffisants.');return;}
  G.mortgaged.delete(pos);
  p.money-=cost;
  log(`${pawnLogChar(p)} Lève hypothèque ${G.board[pos].name} → paye M$${cost}`,'loss');
  renderAll(); showMortgageModal('unmortgage');
}

function showTradeSoon(){
  toast("Échange entre joueurs : bientôt disponible !");
}

function showMenuModal(){
  document.getElementById('modalTitle').textContent='Menu';
  document.getElementById('modalBody').innerHTML=`
    <div style="font-size:13px;color:var(--text2);line-height:1.6">
      Partie en cours — ${G.players.length} joueurs, tour ${G.turn}.<br>
      ${G.players.map(pl=>`${pawnIconHtml(pl.pawn)} ${pl.name} : ${MONEY_ICON}${pl.money.toLocaleString()}`).join('<br>')}
    </div>
  `;
  document.getElementById('modalFooter').innerHTML=`
    <button class="btn-sm" onclick="closeModal()">Fermer</button>
    <button class="btn-sm red" onclick="if(confirm('Recommencer une nouvelle partie ?')) location.reload()">Nouvelle partie</button>
  `;
  document.getElementById('modalOverlay').classList.remove('hidden');
}

function payJail(){
  const p=G.players[G.currentPlayer];
  if(p.money<50){toast('Fonds insuffisants.');return;}
  p.money-=50; p.inJail=false; p.jailTurns=0;
  log(`${pawnLogChar(p)} Paye M$50 pour sortir de prison.`,'loss');
  renderAll();
}
function useGetOutCard(){
  const p=G.players[G.currentPlayer];
  if(p.getOutCards<=0) return;
  p.getOutCards--; p.inJail=false; p.jailTurns=0;
  log(`${pawnLogChar(p)} Utilise sa carte sortie de prison.`,'gain');
  renderAll();
}

// ══════════════════════════════════════════════════════════════════════════════
// TURN MANAGEMENT
// ══════════════════════════════════════════════════════════════════════════════

function endTurn(){
  const p=G.players[G.currentPlayer];
  const rolledDoubles=G.diceRoll&&G.diceRoll[0]===G.diceRoll[1]&&G.doublesCount>0;
  if(rolledDoubles&&!p.inJail){
    log(`${pawnLogChar(p)} Doubles — rejoue !`,'chance');
    G.phase='roll';
    G.diceRoll=null;
    renderAll();
    return;
  }
  nextPlayer();
}

function nextPlayer(){
  G.doublesCount=0;
  G.diceRoll=null;
  let next=G.currentPlayer;
  for(let i=0;i<G.players.length;i++){
    next=(next+1)%G.players.length;
    if(!G.players[next].bankrupt) break;
  }
  G.currentPlayer=next;
  if(next<=G.currentPlayer-1) G.turn++;
  G.phase='roll';
  const p=G.players[next];
  log(`--- Tour de ${pawnLogChar(p)} ${p.name} ---`,'system');
  renderAll();
}

function declareBankrupt(){
  const p=G.players[G.currentPlayer];
  if(!confirm(`${p.name} déclare faillite ?`)) return;
  p.bankrupt=true;
  p.properties.forEach(pos=>{G.board[pos].owner=null; delete G.propertyBuildings[pos];});
  p.properties=[];
  log(`🏳️ ${pawnLogChar(p)} ${p.name} est en faillite !`,'loss');
  const alive=G.players.filter(pl=>!pl.bankrupt);
  if(alive.length===1){
    endGame(alive[0]);
    return;
  }
  nextPlayer();
}

function endGame(winner){
  document.getElementById('winPawn').innerHTML=pawnIconHtml(winner.pawn);
  document.getElementById('winSub').textContent=`${winner.name} remporte la partie avec M$${winner.money.toLocaleString()} et ${winner.properties.length} propriétés !`;
  document.getElementById('gameScreen').classList.add('hidden');
  document.getElementById('winScreen').classList.remove('hidden');
}

// ══════════════════════════════════════════════════════════════════════════════
// CELL INFO MODAL
// ══════════════════════════════════════════════════════════════════════════════

function showCellInfo(pos){
  const cell=G.board[pos];
  if(!cell) return;
  const owner=ownerOf(pos);
  const b=G.propertyBuildings[pos]||{houses:0,hotel:0};
  const color=GROUP_COLORS[cell.group]||'#444';

  let body='';
  if(['property','station','utility'].includes(cell.type)){
    body=`
      <div class="owner-line">${owner?`Propriétaire : ${pawnIconHtml(owner.pawn)} ${owner.name}`:'Disponible à l’achat'}</div>
      ${b.hotel?`<div class="build-line">${ALERTEPRISON_ICON} Alerteprison</div>`:b.houses>0?`<div class="build-line">${ALERTE_ICON} × ${b.houses}</div>`:''}
      ${G.mortgaged.has(pos)?'<div class="mortgaged-line">🔒 Hypothéquée</div>':''}
      ${titleDeedHtml(cell, color)}
    `;
  } else {
    body=`<div style="color:var(--text2);font-size:14px">${fmtM(cell.desc||'Case spéciale.')}</div>`;
  }

  showInfo(cell.name, body, cell.icon);
}

function showInfo(title, bodyHtml, icon){
  const iconHtml = icon ? renderCellIconHtml(icon, false) + ' ' : '';
  document.getElementById('modalTitle').innerHTML = iconHtml + title;
  document.getElementById('modalBody').innerHTML=bodyHtml;
  document.getElementById('modalFooter').innerHTML=`<button class="btn-sm" onclick="closeModal()">Fermer</button>`;
  document.getElementById('modalOverlay').classList.remove('hidden');
}

function closeModal(){document.getElementById('modalOverlay').classList.add('hidden');}

// ══════════════════════════════════════════════════════════════════════════════
// LOG & HELPERS
// ══════════════════════════════════════════════════════════════════════════════

function log(msg, type=''){
  const area=document.getElementById('logArea');
  const div=document.createElement('div');
  div.className='log-entry'+(type?' '+type:'');
  div.textContent=msg;
  area.appendChild(div);
  area.scrollTop=area.scrollHeight;
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}
</script>
